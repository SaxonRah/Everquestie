name: PR packaged map catalog runtime policy validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/runtime_policy.py'
      - 'EverQuestie.py'
      - 'eqquest/__main__.py'
      - 'tests/test_runtime_map_policy.py'
      - '.github/workflows/pr-runtime-map-policy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run runtime map policy tests
        run: python -m unittest tests.test_runtime_map_policy -v
      - name: Run runtime storage regressions
        run: python -m unittest tests.test_runtime_database_split -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
