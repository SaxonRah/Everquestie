name: PR travel frontier

on:
  push:
    branches:
      - agent/travel-frontier-explicit-zone-lines

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run travel frontier regressions
        run: python -m unittest tests.test_travel_frontier tests.test_travel_frontier_cli tests.test_zone_travel tests.test_zone_coverage -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
