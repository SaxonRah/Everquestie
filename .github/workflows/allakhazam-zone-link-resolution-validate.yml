name: Allakhazam mirror link validation

permissions:
  contents: write

on:
  push:
    branches:
      - agent/allakhazam-zone-link-resolution

jobs:
  patch-and-validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire mirror importer and diagnostics
        shell: python
        run: |
          from pathlib import Path

          build = Path("eqquest/knowledge_build.py")
          text = build.read_text(encoding="utf-8")
          text = text.replace(
              "from .allakhazam import AllakhazamImporter\n",
              "from .allakhazam_mirror_importer import AllakhazamMirrorImporter\n",
          )
          text = text.replace(
              "summary = AllakhazamImporter(context.db).import_mirror(root)",
              "summary = AllakhazamMirrorImporter(context.db).import_mirror(root)",
          )
          build.write_text(text, encoding="utf-8")

          cli = Path("tools/build_knowledge_db.py")
          text = cli.read_text(encoding="utf-8")
          marker = '    print(f"integrity: {report.snapshot.diagnostics.get(\'integrity\')}")\n'
          diagnostic = '''    print(f"integrity: {report.snapshot.diagnostics.get('integrity')}")
              print(
                  "provider zone reconciliation: "
                  + ", ".join(
                      f"{key}={value}"
                      for key, value in sorted(report.snapshot.provider_zone_reconciliation.items())
                  )
              )
              print(
                  "provider zone travel: "
                  + ", ".join(
                      f"{key}={value}"
                      for key, value in sorted(report.snapshot.provider_zone_travel.items())
                  )
              )
          '''
          diagnostic = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in diagnostic.splitlines()
          ) + "\n"
          if "provider zone reconciliation:" not in text:
              if marker not in text:
                  raise SystemExit("build_knowledge_db.py integrity marker not found")
              text = text.replace(marker, diagnostic)

          old = (
              "    except (ValueError, FileExistsError, FileNotFoundError) as exc:\n"
              "        raise SystemExit(str(exc)) from exc\n"
          )
          new = (
              "    except FileExistsError as exc:\n"
              "        existing = exc.args[0] if exc.args else args.working_db\n"
              "        raise SystemExit(\n"
              "            f\"Output already exists: {existing}. Use --force to rebuild it.\"\n"
              "        ) from exc\n"
              "    except (ValueError, FileNotFoundError) as exc:\n"
              "        raise SystemExit(str(exc)) from exc\n"
          )
          if "except FileExistsError as exc:" not in text:
              if old not in text:
                  raise SystemExit("build_knowledge_db.py exception marker not found")
              text = text.replace(old, new)
          cli.write_text(text, encoding="utf-8")

      - name: Compile
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Focused mirror/provider regressions
        run: python -m unittest tests.test_allakhazam_mirror_links tests.test_allakhazam_zone_travel_direction tests.test_knowledge_build tests.test_provider_zone_reconciliation tests.test_provider_zone_travel tests.test_provider_zone_travel_runtime tests.test_build_knowledge_cli -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v

      - name: Commit generated wiring
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if git diff --quiet -- eqquest/knowledge_build.py tools/build_knowledge_db.py; then
            exit 0
          fi
          git config user.name "EverQuestie CI"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/knowledge_build.py tools/build_knowledge_db.py
          git commit -m "Use mirror-aware Allakhazam relationship links"
          git push origin HEAD:agent/allakhazam-zone-link-resolution
