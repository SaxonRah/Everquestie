name: PR route actionable evidence validation

on:
  push:
    branches:
      - agent/route-actionable-evidence

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run actionable route regressions
        run: python -m unittest tests.test_route_guidance_evidence tests.test_route_guidance tests.test_route_guidance_ui tests.test_zone_coverage -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
