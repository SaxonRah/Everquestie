name: Apply builder navigation refresh UI

on:
  push:
    branches:
      - agent/refresh-derived-navigation-catalog

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused edits
        shell: python
        run: |
          from pathlib import Path

          path = Path('eqquest/travel.py')
          text = path.read_text(encoding='utf-8')
          edits = [
              (
                  'from .nearby import nearby_points, nearby_text\n',
                  'from .nearby import nearby_points, nearby_text\nfrom .navigation_catalog import ensure_builder_navigation_catalog\n',
              ),
              (
                  '        self._build()\n\n    def _build(self) -> None:\n',
                  '''        self._build()\n\n    def _ensure_navigation_catalog_ready(self) -> bool:\n        """Refresh stale builder-only map/zone/travel derivatives before reads."""\n        try:\n            refresh = ensure_builder_navigation_catalog(self.db)\n        except Exception as exc:\n            status = getattr(self, "status_var", None)\n            if status is not None:\n                status.set(f"Navigation catalog refresh failed: {exc}")\n            return False\n        if refresh.refreshed:\n            status = getattr(self, "status_var", None)\n            if status is not None:\n                linked = refresh.map_bindings.linked if refresh.map_bindings is not None else 0\n                routes = refresh.travel.linked if refresh.travel is not None else 0\n                status.set(\n                    f"Navigation catalog refreshed from stored map knowledge: "\n                    f"{linked:,} map binding(s), {routes:,} linked travel edge(s)."\n                )\n        return True\n\n    def _build(self) -> None:\n''',
              ),
              (
                  '    def show_zone_context(self) -> None:\n        self._clear_nearby_points()\n',
                  '    def show_zone_context(self) -> None:\n        self._clear_nearby_points()\n        if not TravelFrame._ensure_navigation_catalog_ready(self):\n            return\n',
              ),
              (
                  '    def show_nearby(self) -> None:\n        # Nearby geometry is meaningful only in the zone that owns the observed /loc.\n',
                  '    def show_nearby(self) -> None:\n        if not TravelFrame._ensure_navigation_catalog_ready(self):\n            return\n        # Nearby geometry is meaningful only in the zone that owns the observed /loc.\n',
              ),
              (
                  '    def map_nearest(self) -> None:\n        """Send the nearest confirmed live-zone point to the Map owner in game space."""\n        zone = self._live_current_zone()\n',
                  '    def map_nearest(self) -> None:\n        """Send the nearest confirmed live-zone point to the Map owner in game space."""\n        if not TravelFrame._ensure_navigation_catalog_ready(self):\n            return\n        zone = self._live_current_zone()\n',
              ),
              (
                  '    def find_route(self) -> None:\n        self._clear_nearby_points()\n',
                  '    def find_route(self) -> None:\n        self._clear_nearby_points()\n        if not TravelFrame._ensure_navigation_catalog_ready(self):\n            return\n',
              ),
          ]
          for old, new in edits:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'travel.py expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('eqquest/route_guidance_ui.py')
          text = path.read_text(encoding='utf-8')
          edits = [
              (
                  '    def show_zone_context(self) -> None:\n        """Render canonical zone knowledge plus source-safe route map actionability."""\n        self._clear_nearby_points()\n',
                  '    def show_zone_context(self) -> None:\n        """Render canonical zone knowledge plus source-safe route map actionability."""\n        self._clear_nearby_points()\n        if not TravelFrame._ensure_navigation_catalog_ready(self):\n            return\n',
              ),
              (
                  '    def find_route(self) -> None:\n        self._clear_nearby_points()\n',
                  '    def find_route(self) -> None:\n        self._clear_nearby_points()\n        if not TravelFrame._ensure_navigation_catalog_ready(self):\n            return\n',
              ),
          ]
          for old, new in edits:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'route_guidance_ui.py expected one match, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eqquest/travel.py eqquest/route_guidance_ui.py
          git commit -m "Refresh stale builder navigation before Travel reads"
          git push origin HEAD:agent/refresh-derived-navigation-catalog
