name: PR release portable map migration

on:
  push:
    branches:
      - agent/release-portable-map-migration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run release portability regressions
        run: python -m unittest tests.test_map_portability tests.test_knowledge_snapshot -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
