name: Fix map mipmap aliasing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-map-mipmap-aliasing.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build coverage-preserving map mipmaps
        shell: python
        run: |
          from pathlib import Path

          p = Path('eqquest/mapraster.py')
          s = p.read_text(encoding='utf-8')

          old = '''    line_width: int = 1\n'''
          new = '''    line_width: int = 1\n    # Number of 2x coverage-preserving downsample levels to derive from the\n    # high-resolution wall. These are built off the Tk thread once per wall.\n    mip_levels: int = 0\n'''
          if old not in s:
              raise SystemExit('RasterRequest line_width field not found')
          s = s.replace(old, new, 1)

          old = '''    source_lines: int\n'''
          new = '''    source_lines: int\n    # (divisor, PPM bytes), where divisor 2 means half width/height, etc.\n    mipmaps: tuple[tuple[int, bytes], ...] = ()\n'''
          if old not in s:
              raise SystemExit('RasterResult source_lines field not found')
          s = s.replace(old, new, 1)

          marker = '''def render_map_raster(req: RasterRequest) -> RasterResult:\n'''
          if marker not in s:
              raise SystemExit('render_map_raster marker not found')

          helper = r'''
          def _ppm_parts(ppm: bytes) -> tuple[int, int, bytes]:
              """Parse the simple binary P6 PPM emitted by this module."""
              try:
                  magic, dimensions, maximum, pixels = ppm.split(b"\n", 3)
                  width_s, height_s = dimensions.split()
                  width = int(width_s)
                  height = int(height_s)
              except Exception as exc:
                  raise ValueError("invalid EverQuestie PPM") from exc
              if magic != b"P6" or maximum != b"255":
                  raise ValueError("unsupported EverQuestie PPM")
              expected = width * height * 3
              if len(pixels) != expected:
                  raise ValueError(f"PPM pixel length {len(pixels)} != {expected}")
              return width, height, pixels


          def downsample_ppm_2x_coverage(ppm: bytes, background: RGB) -> bytes:
              """Half a wall image without dropping thin map lines.

              Tk PhotoImage's ``subsample`` is nearest-neighbour: it selects one
              source pixel and can completely miss a one-pixel diagonal. Map walls
              need coverage semantics instead. Each destination pixel represents a
              2x2 source footprint; if any footprint pixel is non-background, retain
              the strongest wall pixel in that footprint.
              """
              width, height, source = _ppm_parts(ppm)
              out_w = max(1, (width + 1) // 2)
              out_h = max(1, (height + 1) // 2)
              br, bg, bb = background
              bg_triplet = bytes((br, bg, bb))
              out = bytearray(bg_triplet * (out_w * out_h))
              src = memoryview(source)

              for oy in range(out_h):
                  sy0 = oy * 2
                  sy1 = min(height, sy0 + 2)
                  for ox in range(out_w):
                      sx0 = ox * 2
                      sx1 = min(width, sx0 + 2)
                      best = None
                      best_distance = -1
                      for sy in range(sy0, sy1):
                          row = sy * width * 3
                          for sx in range(sx0, sx1):
                              index = row + sx * 3
                              r = src[index]
                              g = src[index + 1]
                              b = src[index + 2]
                              if r == br and g == bg and b == bb:
                                  continue
                              distance = (r - br) ** 2 + (g - bg) ** 2 + (b - bb) ** 2
                              if distance > best_distance:
                                  best_distance = distance
                                  best = (r, g, b)
                      if best is not None:
                          dst = (oy * out_w + ox) * 3
                          out[dst:dst + 3] = bytes(best)

              header = f"P6\n{out_w} {out_h}\n255\n".encode("ascii")
              return header + bytes(out)


          def build_coverage_mipmaps(ppm: bytes, background: RGB, levels: int) -> tuple[tuple[int, bytes], ...]:
              """Build a power-of-two wall-image pyramid from one high-res raster."""
              current = ppm
              divisor = 1
              result: list[tuple[int, bytes]] = []
              for _ in range(max(0, int(levels))):
                  current = downsample_ppm_2x_coverage(current, background)
                  divisor *= 2
                  result.append((divisor, current))
              return tuple(result)


          '''
          import textwrap
          helper = textwrap.dedent(helper)
          s = s.replace(marker, helper + marker, 1)

          old = '''    header = f"P6\\n{width} {height}\\n255\\n".encode("ascii")\n    return RasterResult(\n        generation=req.generation,\n        ppm=header + bytes(pixels),\n'''
          new = '''    header = f"P6\\n{width} {height}\\n255\\n".encode("ascii")\n    ppm = header + bytes(pixels)\n    mipmaps = build_coverage_mipmaps(\n        ppm, map_background_rgb(req.theme_id), req.mip_levels\n    ) if req.mip_levels else ()\n    return RasterResult(\n        generation=req.generation,\n        ppm=ppm,\n'''
          if old not in s:
              raise SystemExit('RasterResult construction prefix not found')
          s = s.replace(old, new, 1)

          old = '''        source_lines=source_lines,\n    )\n'''
          new = '''        source_lines=source_lines,\n        mipmaps=mipmaps,\n    )\n'''
          if old not in s:
              raise SystemExit('RasterResult construction suffix not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Use mipmaps instead of Tk downsampling
        shell: python
        run: |
          from pathlib import Path

          p = Path('eqquest/mapview.py')
          s = p.read_text(encoding='utf-8')

          old = '''        self._wall_scaled_cache: dict[tuple[int, int], tk.PhotoImage] = {}\n'''
          new = '''        self._wall_scaled_cache: dict[tuple[int, int, int], tk.PhotoImage] = {}\n        # Power-of-two, coverage-preserving wall images derived once from the\n        # high-res wall. Key 1 is the source, 2 is half-size, 4 quarter-size, etc.\n        self._wall_mip_photos: dict[int, tk.PhotoImage] = {}\n'''
          if old not in s:
              raise SystemExit('wall cache declaration not found')
          s = s.replace(old, new, 1)

          old = '''        self._wall_scaled_cache.clear()\n        self._wall_dirty = True\n'''
          new = '''        self._wall_scaled_cache.clear()\n        self._wall_mip_photos.clear()\n        self._wall_dirty = True\n'''
          if old not in s:
              raise SystemExit('load_map wall cache reset not found')
          s = s.replace(old, new, 1)

          old = '''            line_width=factor,\n            elevation_enabled=enabled_z,\n'''
          new = '''            line_width=factor,\n            # 4x source -> 2x -> 1x -> 0.5x. If memory constraints select a\n            # smaller source factor, the same three levels still give a lower\n            # prefiltered base that can be safely upscaled.\n            mip_levels=3,\n            elevation_enabled=enabled_z,\n'''
          if old not in s:
              raise SystemExit('RasterRequest wall options not found')
          s = s.replace(old, new, 1)

          old = '''        self._raster_photo = photo\n        self._display_photo = None\n        self._wall_scaled_cache.clear()\n'''
          new = '''        self._raster_photo = photo\n        self._display_photo = None\n        self._wall_scaled_cache.clear()\n        self._wall_mip_photos = {1: photo}\n        # The expensive filtering was already done by the background raster\n        # worker. Converting these few cached PPM levels into Tk images happens\n        # only when the wall itself changes, never on pan/zoom.\n        for divisor, mip_ppm in result.mipmaps:\n            try:\n                self._wall_mip_photos[int(divisor)] = tk.PhotoImage(data=mip_ppm, format="PPM")\n            except tk.TclError:\n                continue\n'''
          if old not in s:
              raise SystemExit('raster install cache block not found')
          s = s.replace(old, new, 1)

          start = s.index('    def _scaled_wall_photo(self) -> tk.PhotoImage | None:')
          end = s.index('    def _refresh_wall_display(self) -> None:', start)
          replacement = r'''    def _scaled_wall_photo(self) -> tk.PhotoImage | None:
              """Return a cached wall image without ever downsampling in Tk.

              Thin EQ map lines are damaged by PhotoImage ``subsample``. Select the
              largest prefiltered mip that is no larger than the requested display,
              then use Tk only to upscale that mip. Upscaling duplicates coverage;
              it cannot discard a wall pixel.
              """
              if self._raster_photo is None:
                  return None
              desired_ratio = self.scale / max(self._wall_base_scale, 1e-9)
              if desired_ratio <= 0:
                  return None

              available = sorted(self._wall_mip_photos)
              divisor = available[-1]
              for candidate in available:
                  mip_ratio = 1.0 / candidate
                  if mip_ratio <= desired_ratio + 1e-12:
                      divisor = candidate
                      break
              source = self._wall_mip_photos.get(divisor, self._raster_photo)
              mip_ratio = 1.0 / divisor
              upscale = max(1.0, desired_ratio / mip_ratio)
              fraction = Fraction(upscale).limit_denominator(16)
              numerator = max(1, fraction.numerator)
              denominator = max(1, fraction.denominator)
              # Guard the invariant: Tk is allowed to enlarge only. If rational
              # approximation somehow crossed below 1, keep the mip unscaled.
              if numerator < denominator:
                  numerator = denominator = 1
              if numerator == denominator:
                  return source

              key = (divisor, numerator, denominator)
              cached = self._wall_scaled_cache.get(key)
              if cached is not None:
                  return cached
              target = tk.PhotoImage()
              try:
                  target.tk.call(
                      str(target), "copy", str(source),
                      "-zoom", numerator, numerator,
                      "-subsample", denominator, denominator,
                  )
              except tk.TclError:
                  return source
              self._wall_scaled_cache[key] = target
              if len(self._wall_scaled_cache) > 12:
                  oldest = next(iter(self._wall_scaled_cache))
                  if oldest != key:
                      self._wall_scaled_cache.pop(oldest, None)
              return target

          '''
          import textwrap
          replacement = textwrap.dedent(replacement)
          replacement = ''.join(('    ' + line if line.strip() else line) for line in replacement.splitlines(True))
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Add mipmap regression tests
        shell: python
        run: |
          from pathlib import Path

          p = Path('tests/test_mapraster.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''    def test_theme_palette_is_stable(self) -> None:\n'''
          if anchor not in s:
              raise SystemExit('test insertion anchor not found')
          test = r'''    def test_coverage_mipmap_keeps_thin_diagonal_present(self) -> None:
              layer = MapLayer(0, Path('diagonal.txt'))
              layer.lines.append(MapLine(0, 0, 0, 31, 31, 0, 255, 0, 0))
              zone = ZoneMap('diagonal', Path('.'), {0: layer})
              req = RasterRequest(
                  generation=9,
                  zone_map=zone,
                  canvas_width=32,
                  canvas_height=32,
                  buffer_px=0,
                  scale=1.0,
                  offset_x=0.0,
                  offset_y=0.0,
                  enabled_layers=(0,),
                  theme_id=MAP_THEME_STONE,
                  mip_levels=2,
              )
              result = render_map_raster(req)
              self.assertEqual([d for d, _ppm in result.mipmaps], [2, 4])
              background = bytes(map_background_rgb(MAP_THEME_STONE))
              for divisor, ppm in result.mipmaps:
                  _magic, dims, _maximum, pixels = ppm.split(b'\n', 3)
                  width, height = map(int, dims.split())
                  # Every output row crossed by the diagonal must retain at least
                  # one non-background pixel: no nearest-neighbour dash pattern.
                  for y in range(height):
                      row = pixels[y * width * 3:(y + 1) * width * 3]
                      self.assertTrue(
                          any(row[x:x + 3] != background for x in range(0, len(row), 3)),
                          f'missing diagonal coverage at divisor {divisor}, row {y}',
                      )

          '''
          import textwrap
          test = textwrap.dedent(test)
          test = ''.join(('    ' + line if line.strip() else line) for line in test.splitlines(True))
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s, encoding='utf-8')

      - name: Compile and test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v
          grep -q 'mip_levels=3' eqquest/mapview.py
          grep -q 'downsample_ppm_2x_coverage' eqquest/mapraster.py

      - name: Commit mipmap fix
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/mapview.py eqquest/mapraster.py tests/test_mapraster.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use coverage mipmaps for cached map zoom"
          git push
