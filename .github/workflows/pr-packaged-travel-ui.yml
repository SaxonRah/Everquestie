name: PR packaged travel and immutable UI validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/travel.py'
      - 'eqquest/runtime_policy.py'
      - 'tests/test_travel_view.py'
      - 'tests/test_runtime_map_policy.py'
      - '.github/workflows/pr-packaged-travel-ui.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run travel presentation tests
        run: python -m unittest tests.test_travel_view -v
      - name: Run packaged runtime policy tests
        run: python -m unittest tests.test_runtime_map_policy tests.test_runtime_database_split -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
