name: PR local map variant validation

on:
  push:
    branches:
      - agent/local-map-variant-choice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run local variant regressions
        run: python -m unittest tests.test_local_map_variant tests.test_local_map_variant_runtime_ui tests.test_local_map_readiness tests.test_runtime_map_policy -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
