name: PR shipped canonical map resolution validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/map_resolution.py'
      - 'eqquest/runtime_policy.py'
      - 'tests/test_map_resolution.py'
      - '.github/workflows/pr-canonical-map-resolution.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run canonical map resolution tests
        run: python -m unittest tests.test_map_resolution -v
      - name: Run map/runtime regressions
        run: python -m unittest tests.test_zone_catalog tests.test_runtime_map_policy tests.test_runtime_database_split -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
