name: PR provider zone metadata

on:
  push:
    branches:
      - agent/provider-zone-metadata-context

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run provider metadata regressions
        run: python -m unittest tests.test_provider_zone_metadata tests.test_provider_zone_world_context tests.test_provider_zone_projection tests.test_provider_zone_reconciliation tests.test_provider_zone_travel tests.test_provider_zone_travel_runtime tests.test_zone_context tests.test_knowledge_snapshot -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
