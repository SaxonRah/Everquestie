name: PR builder mechanics parity

on:
  push:
    branches:
      - agent/reconcile-mechanics-after-client-import

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run mechanics parity regressions
        run: python -m unittest tests.test_eqclient_mechanics_reconcile tests.test_mechanics_context tests.test_mechanics_context_ui tests.test_mechanics_identity tests.test_knowledge_snapshot -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
