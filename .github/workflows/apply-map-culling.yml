name: Apply viewport-culling map renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-map-culling.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch map viewer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('eqquest/mapview.py')
          s = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'import colorsys\nimport json\n',
              'import colorsys\nimport heapq\nimport json\n',
              'heapq import',
          )
          replace_once(
              'from .db import Database\n',
              'from .db import Database\nfrom .mapindex import SpatialMapIndex, bbox_intersects\n',
              'mapindex import',
          )

          replace_once(
              '        # Theme color conversion is deterministic and reused for every native RGB.\n'
              '        self._color_cache: dict[tuple[str, int, int, int, bool], str] = {}\n\n'
              '        self._build()\n',
              '        # Theme color conversion is deterministic and reused for every native RGB.\n'
              '        self._color_cache: dict[tuple[str, int, int, int, bool], str] = {}\n\n'
              '        # Only a buffered viewport worth of native map objects is kept in Tk.\n'
              '        # Good/Brewall maps can contain tens of thousands of segments; keeping\n'
              '        # all of them alive makes even Canvas.move() expensive on Windows Tk.\n'
              '        self._spatial_index: SpatialMapIndex | None = None\n'
              '        self._static_render_bounds: tuple[float, float, float, float] | None = None\n'
              '        self._static_refresh_job: str | None = None\n'
              '        self._base_map_status = ""\n\n'
              '        self._build()\n',
              'spatial state',
          )

          replace_once(
              '                command=self._apply_static_visibility,\n'
              '            ).pack(side="left", padx=(4, 0))\n',
              '                command=self._on_static_options_changed,\n'
              '            ).pack(side="left", padx=(4, 0))\n',
              'layer callback',
          )
          replace_once(
              '            line1, text="Map labels", variable=self.show_labels, command=self._apply_static_visibility\n',
              '            line1, text="Map labels", variable=self.show_labels, command=self._on_static_options_changed\n',
              'label callback',
          )

          replace_once(
              '        self.map_file.set(str(self.zone_map.base_path))\n'
              '        counts = []\n',
              '        self.map_file.set(str(self.zone_map.base_path))\n'
              '        self._spatial_index = SpatialMapIndex(self.zone_map)\n'
              '        self._static_render_bounds = None\n'
              '        counts = []\n',
              'index map load',
          )
          replace_once(
              '        self.map_status.set(f"{self.zone_map.stem} | " + " | ".join(counts))\n',
              '        self._base_map_status = f"{self.zone_map.stem} | " + " | ".join(counts)\n'
              '        self.map_status.set(self._base_map_status)\n',
              'base map status',
          )

          old_resize = '''    def _on_resize(self, _event) -> None:\n        if self._fit_pending:\n            self.fit()\n        elif self.follow_player.get() and self.zone_map is not None and self.get_location():\n            self.center_player()\n        elif self.zone_map is None:\n            self._draw_empty_message()\n'''
          new_resize = '''    def _on_resize(self, _event) -> None:\n        if self._fit_pending:\n            self.fit()\n        elif self.follow_player.get() and self.zone_map is not None and self.get_location():\n            self.center_player()\n        elif self.zone_map is not None:\n            self._schedule_static_refresh(80)\n        else:\n            self._draw_empty_message()\n'''
          replace_once(old_resize, new_resize, 'resize')

          replace_once(
              '        if dx or dy:\n'
              '            self.canvas.move("map_content", dx, dy)\n\n'
              '    def _pan_end',
              '        if dx or dy:\n'
              '            self.canvas.move("map_content", dx, dy)\n'
              '            self._schedule_static_refresh_if_needed(90)\n\n'
              '    def _pan_end',
              'pan refresh',
          )
          replace_once(
              '        self._pan_start = None\n'
              '        self._schedule_save_view(180)\n',
              '        self._pan_start = None\n'
              '        self._schedule_static_refresh(0)\n'
              '        self._schedule_save_view(180)\n',
              'pan end refresh',
          )
          replace_once(
              '        self.canvas.scale("map_content", sx, sy, actual, actual)\n'
              '        # Font sizes/line widths remain screen-readable; only coordinates scale.\n'
              '        self._schedule_save_view()\n',
              '        self.canvas.scale("map_content", sx, sy, actual, actual)\n'
              '        # Keep wheel interaction cheap: scale the current buffered display list\n'
              '        # immediately, then repopulate the viewport after wheel input settles.\n'
              '        self._schedule_static_refresh(90)\n'
              '        self._schedule_save_view()\n',
              'zoom refresh',
          )
          replace_once(
              '        if dx or dy:\n'
              '            self.canvas.move("map_content", dx, dy)\n\n'
              '    def _motion',
              '        if dx or dy:\n'
              '            self.canvas.move("map_content", dx, dy)\n'
              '            self._schedule_static_refresh_if_needed(60)\n\n'
              '    def _motion',
              'move view refresh',
          )

          marker = '    def _on_elevation_changed(self) -> None:\n'
          if marker not in s:
              raise SystemExit('render helper insertion marker missing')
          helpers = r'''    def _viewport_world_bounds(self, margin_px: float = 0.0) -> tuple[float, float, float, float]:
        w = max(1, self.canvas.winfo_width())
        h = max(1, self.canvas.winfo_height())
        x0, y0 = self._screen_to_world(-margin_px, -margin_px)
        x1, y1 = self._screen_to_world(w + margin_px, h + margin_px)
        return min(x0, x1), min(y0, y1), max(x0, x1), max(y0, y1)

    def _buffered_world_bounds(self) -> tuple[float, float, float, float]:
        w = max(1, self.canvas.winfo_width())
        h = max(1, self.canvas.winfo_height())
        # Enough off-screen geometry for a useful drag runway, but not so much that
        # Windows Tk ends up managing the entire zone again.
        margin = max(140.0, min(320.0, min(w, h) * 0.32))
        return self._viewport_world_bounds(margin)

    @staticmethod
    def _bounds_contains(outer, inner) -> bool:
        return outer[0] <= inner[0] and outer[1] <= inner[1] and outer[2] >= inner[2] and outer[3] >= inner[3]

    def _schedule_static_refresh_if_needed(self, delay_ms: int = 75) -> None:
        if self.zone_map is None:
            return
        current = self._viewport_world_bounds(20.0)
        if self._static_render_bounds is None or not self._bounds_contains(self._static_render_bounds, current):
            self._schedule_static_refresh(delay_ms)

    def _schedule_static_refresh(self, delay_ms: int = 75) -> None:
        if self.zone_map is None:
            return
        if self._static_refresh_job is not None:
            try:
                self.after_cancel(self._static_refresh_job)
            except tk.TclError:
                pass
        self._static_refresh_job = self.after(max(0, delay_ms), self._refresh_after_view_change)

    def _refresh_after_view_change(self) -> None:
        self._static_refresh_job = None
        if self.zone_map is None:
            return
        self._rebuild_static()
        # Zooming scales marker radii as coordinates. Recreate the small dynamic
        # layers so markers/text retain constant screen-readable sizes.
        self._redraw_overlays()
        self._redraw_position()

    def _on_static_options_changed(self) -> None:
        self._static_render_bounds = None
        self._schedule_static_refresh(0)

    def _line_budget(self) -> int:
        area = max(1, self.canvas.winfo_width()) * max(1, self.canvas.winfo_height())
        return max(1200, min(2400, 650 + area // 520))

    def _label_budget(self) -> int:
        area = max(1, self.canvas.winfo_width()) * max(1, self.canvas.winfo_height())
        return max(70, min(260, area // 4200))

    def _update_render_status(self, visible_lines: int, drawn_lines: int, visible_labels: int, drawn_labels: int) -> None:
        if not self._base_map_status:
            return
        lod = ''
        if drawn_lines < visible_lines or drawn_labels < visible_labels:
            lod = ' | adaptive detail'
        self.map_status.set(
            f'{self._base_map_status} | view {drawn_lines:,}/{visible_lines:,} lines, '
            f'{drawn_labels:,}/{visible_labels:,} labels{lod}'
        )

'''
          s = s.replace(marker, helpers + marker, 1)

          start = s.index('    def _rebuild_static(self) -> None:\n')
          end = s.index('    def _apply_static_visibility(self) -> None:\n', start)
          new_rebuild = r'''    def _rebuild_static(self) -> None:
        self.canvas.delete("map_geometry")
        self.canvas.delete("map_labels")
        self.canvas.delete("map_message")
        if self.zone_map is None:
            self._draw_empty_message()
            return
        if self._spatial_index is None:
            self._spatial_index = SpatialMapIndex(self.zone_map)

        bounds = self._buffered_world_bounds()
        self._static_render_bounds = bounds
        z_context = self._z_context()
        enabled_layers = self._enabled_layers()

        # Candidate tuple: (screen length squared, layer, source index, x0,y0,x1,y1,line)
        line_candidates = []
        point_candidates = []
        visible_lines = 0
        visible_labels = 0
        dedupe: set[tuple] = set()

        for layer_no in enabled_layers:
            layer = self.zone_map.layers.get(layer_no)
            if layer is None:
                continue
            line_ids, point_ids = self._spatial_index.query_layer(layer_no, bounds)

            for line_no in line_ids:
                line = layer.lines[line_no]
                line_bounds = (
                    min(line.x0, line.x1), min(line.y0, line.y1),
                    max(line.x0, line.x1), max(line.y0, line.y1),
                )
                if not bbox_intersects(line_bounds, bounds):
                    continue
                if not self._z_visible_for_context(line.z0, line.z1, z_context):
                    continue
                x0, y0 = self._world_to_screen(line.x0, line.y0)
                x1, y1 = self._world_to_screen(line.x1, line.y1)
                dx, dy = x1 - x0, y1 - y0
                length2 = dx * dx + dy * dy
                # Sub-pixel segments do not affect the visible overview but are very
                # expensive when a community map contains thousands of them.
                if length2 < 0.42:
                    continue
                visible_lines += 1

                # Collapse geometry that resolves to the same ~1.5 px segment at
                # the current zoom. Include coarse source color so semantic colors
                # are not merged together.
                q = 1.5
                a = (round(x0 / q), round(y0 / q))
                b = (round(x1 / q), round(y1 / q))
                if b < a:
                    a, b = b, a
                key = (a, b, line.r // 16, line.g // 16, line.b // 16, layer_no)
                if key in dedupe:
                    continue
                dedupe.add(key)
                line_candidates.append((length2, layer_no, line_no, x0, y0, x1, y1, line))

            if self.show_labels.get():
                for point_no in point_ids:
                    point = layer.points[point_no]
                    if not (bounds[0] <= point.x <= bounds[2] and bounds[1] <= point.y <= bounds[3]):
                        continue
                    if not self._z_visible_for_context(point.z, None, z_context):
                        continue
                    x, y = self._world_to_screen(point.x, point.y)
                    visible_labels += 1
                    # Larger source-map labels win; ties prefer labels near the
                    # viewport center, where the user is most likely looking.
                    cx = self.canvas.winfo_width() * 0.5
                    cy = self.canvas.winfo_height() * 0.5
                    dist2 = (x - cx) ** 2 + (y - cy) ** 2
                    point_candidates.append((-point.size, dist2, layer_no, point_no, x, y, point))

        line_budget = self._line_budget()
        if len(line_candidates) > line_budget:
            line_candidates = heapq.nlargest(line_budget, line_candidates, key=lambda row: row[0])

        for _length2, layer_no, _line_no, x0, y0, x1, y1, line in line_candidates:
            self.canvas.create_line(
                x0, y0, x1, y1,
                fill=self._themed_map_color(line.r, line.g, line.b),
                width=1,
                tags=("map_content", "map_static", "map_geometry", f"map_geometry_layer_{layer_no}"),
            )

        drawn_labels = 0
        if self.show_labels.get() and point_candidates:
            point_candidates.sort()
            occupied: set[tuple[int, int]] = set()
            budget = self._label_budget()
            for _neg_size, _dist2, layer_no, _point_no, x, y, point in point_candidates:
                # Approximate text collision grid. This is intentionally coarse:
                # overlapped Tk text is both unreadable and costly to manipulate.
                slot = (int(x // 92), int(y // 22))
                if slot in occupied:
                    continue
                occupied.add(slot)
                font_size = {1: 8, 2: 10, 3: 12}.get(point.size, 9)
                self.canvas.create_text(
                    x, y,
                    text=point.display_text,
                    fill=self._themed_map_color(point.r, point.g, point.b, label=True),
                    font=("TkDefaultFont", font_size),
                    anchor="center",
                    tags=("map_content", "map_static", "map_labels", f"map_label_layer_{layer_no}"),
                )
                drawn_labels += 1
                if drawn_labels >= budget:
                    break

        self._update_render_status(visible_lines, len(line_candidates), visible_labels, drawn_labels)

'''
          s = s[:start] + new_rebuild + s[end:]

          path.write_text(s, encoding='utf-8')
          PY

          python -m py_compile eqquest/mapview.py eqquest/mapindex.py
          python - <<'PY'
          from pathlib import Path
          from eqquest.eqmap import MapLayer, MapLine, MapPoint, ZoneMap
          from eqquest.mapindex import SpatialMapIndex
          layer = MapLayer(0, Path('synthetic.txt'))
          layer.lines.extend([
              MapLine(0, 0, 0, 100, 100, 0, 255, 255, 255),
              MapLine(5000, 5000, 0, 5100, 5100, 0, 255, 0, 0),
          ])
          layer.points.append(MapPoint(50, 50, 0, 0, 255, 0, 1, 'near'))
          zone = ZoneMap('synthetic', Path('.'), {0: layer})
          idx = SpatialMapIndex(zone)
          lines, points = idx.query_layer(0, (-10, -10, 200, 200))
          assert lines == {0}, lines
          assert points == {0}, points
          print('spatial map index smoke OK')
          PY

      - name: Commit viewport-culling renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-map-culling.yml
          git add -A
          git commit -m "Cull map geometry to buffered viewport"
          git push
