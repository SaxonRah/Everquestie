name: Apply full-detail raster map renderer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-map-raster.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch map viewer
        shell: bash
        run: |
          set -euo pipefail
          python .map_patch/apply_raster.py
          python -m py_compile eqquest/mapview.py eqquest/mapraster.py
          python -m unittest tests.test_mapraster -v
          python -m compileall -q eqquest EverQuestie.py

      - name: Commit raster renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .map_patch
          rm -f .github/workflows/apply-map-raster.yml
          rm -f eqquest/mapindex.py
          git add -A
          git commit -m "Render maps as full-detail raster snapshots"
          git push
