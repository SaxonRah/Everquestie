name: Knowledge route location validation

on:
  push:
    branches: [agent/knowledge-route-location]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Focused Knowledge route tests
        run: python -m unittest tests.test_knowledge_route_location tests.test_knowledge_location_choices tests.test_knowledge_related_location_choices -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
