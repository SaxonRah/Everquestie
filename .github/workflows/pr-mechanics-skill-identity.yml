name: PR mechanics skill identity validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/mechanics.py'
      - 'tests/test_mechanics_identity.py'
      - '.github/workflows/pr-mechanics-skill-identity.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run mechanics identity tests
        run: python -m unittest tests.test_mechanics_identity -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
