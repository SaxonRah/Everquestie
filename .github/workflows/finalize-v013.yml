name: Finalize EverQuestie v0.13

on:
  push:
    branches: [main]
    paths:
      - '.finalize/READY'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify expected v0.13 source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f EverQuestie.py
          test -f pyproject.toml
          test -f eqquest/app.py
          test -f eqquest/db.py
          test -f eqquest/allakhazam.py
          test -f eqquest/mapview.py
          test -f eqquest/theme.py
          test -f eqquest/sources/mcp_snapshot.py
          test -f eqquest/sources/eqclient.py
          test -f tools/setup_mcp_submodule.ps1
          test -f tools/build_windows_exe.ps1
          test -f docs/SOURCE_POLICY.md

      - name: Compile and test public checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -q

      - name: Clean bootstrap/private fixture material and pin MCP submodule
        shell: bash
        run: |
          set -euo pipefail

          # The public project never carries the player's log corpus or an Allakhazam mirror.
          git rm -r --ignore-unmatch allakhazam || true
          git rm --ignore-unmatch 'eqlog_*.txt' 'sample_eqlog*.txt' || true
          git rm --ignore-unmatch docs/UPLOAD_STATUS.md || true

          # Intermediate bootstrap chunks are no longer needed after the source tree verifies.
          git rm -r --ignore-unmatch .bootstrap || true

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .mypy_cache/
          .coverage
          htmlcov/
          build/
          dist/
          *.spec
          .venv/
          venv/
          env/
          third_party/everquest1-mcp/
          *.sqlite3
          *.sqlite3-*
          *.db
          *.db-*
          settings.ini
          .eqquest/
          .eq-mcp-snapshot.json
          eqlog_*.txt
          sample_eqlog*.txt
          hts-cache/
          hts-log.txt
          hts-in_progress.lock
          *.tmp
          allakhazam/
          mirrors/
          mirror/
          EOF

          cat > .gitmodules <<'EOF'
          [submodule "third_party/everquest1-mcp"]
            path = third_party/everquest1-mcp
            url = https://github.com/ArtSabintsev/everquest1-mcp.git
          EOF

          mkdir -p third_party
          rm -rf third_party/everquest1-mcp

          # Stage normal files first, then write the real gitlink into the index.
          git add -A
          git update-index --add --cacheinfo 160000,bd8a423a255d866b23df6cecaa1d79bc67232154,third_party/everquest1-mcp

      - name: Commit finalized v0.13 checkout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m 'Finalize EverQuestie v0.13 public source checkout'
            git push origin HEAD:main
          fi
