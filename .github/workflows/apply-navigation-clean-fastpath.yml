name: Apply navigation clean fast path

on:
  push:
    branches:
      - agent/refresh-derived-navigation-catalog

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move stale check before schema work
        shell: python
        run: |
          from pathlib import Path
          path = Path('eqquest/navigation_catalog.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Ensure the stored map-evidence schema exists before installing triggers that\n    # reference it. This creates tables only; it does not crawl or parse local maps.\n    MapCatalog(db)\n    _install_dirty_triggers(db)\n\n    version = db.get_meta("navigation_catalog_version", "")\n    dirty = db.get_meta("navigation_catalog_dirty", "1") == "1"\n    if not force and version == NAVIGATION_CATALOG_VERSION and not dirty:\n        return NavigationCatalogRefresh(False)\n\n    with db.batch():\n'''
          new = '''    # Clean Travel reads must be effectively free. A current version marker implies\n    # the dirty triggers were installed by the successful refresh that wrote it, so\n    # avoid repeating schema/index/trigger work on every button click.\n    version = db.get_meta("navigation_catalog_version", "")\n    dirty = db.get_meta("navigation_catalog_dirty", "1") == "1"\n    if not force and version == NAVIGATION_CATALOG_VERSION and not dirty:\n        return NavigationCatalogRefresh(False)\n\n    # Ensure the stored map-evidence schema exists before installing triggers that\n    # reference it. This creates tables only; it does not crawl or parse local maps.\n    MapCatalog(db)\n    _install_dirty_triggers(db)\n\n    with db.batch():\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one navigation ensure snippet')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eqquest/navigation_catalog.py
          git commit -m "Make clean navigation catalog checks constant-time"
          git push origin HEAD:agent/refresh-derived-navigation-catalog
