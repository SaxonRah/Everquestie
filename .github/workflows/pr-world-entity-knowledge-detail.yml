name: PR world entity Knowledge detail

on:
  push:
    branches:
      - agent/world-entity-knowledge-detail

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run Knowledge detail regressions
        run: python -m unittest tests.test_world_entity_knowledge_detail tests.test_world_entity_context tests.test_provider_zone_metadata tests.test_provider_zone_world_context tests.test_provider_zone_projection tests.test_knowledge_snapshot tests.test_vendor tests.test_map_catalog -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
