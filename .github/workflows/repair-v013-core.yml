name: Repair v0.13 core modules

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v013-core.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble missing core modules
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            'eqquest/app.py:app.py' \
            'eqquest/db.py:db.py' \
            'eqquest/allakhazam.py:allakhazam.py' \
            'eqquest/mapview.py:mapview.py'; do
            target="${spec%%:*}"
            prefix="${spec##*:}"
            mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name "${prefix}.part*" | sort)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo "No staged parts found for ${target}" >&2
              exit 1
            fi
            mkdir -p "$(dirname "$target")"
            cat "${parts[@]}" > "$target"
            python -m py_compile "$target"
            echo "reassembled $target from ${#parts[@]} part(s)"
          done
      - name: Commit repaired modules
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eqquest/app.py eqquest/db.py eqquest/allakhazam.py eqquest/mapview.py
          if ! git diff --cached --quiet; then
            git commit -m "Restore missing EverQuestie v0.13 core modules"
            git push
          fi
