name: Apply exact map zoom cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exact-map-zoom-cache.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch exact zoom rasters
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          # mapraster.py
          p = Path('eqquest/mapraster.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '    # Lower-resolution wall rasters built once from the same vectors.\n    mip_levels: int = 0\n',
              '    # Exact display levels built once from the original vectors.\n    # Entries are (display_level, ratio_to_this_request).\n    exact_levels: tuple[tuple[float, float], ...] = ()\n',
              1,
          )
          s = s.replace(
              '    # (divisor, PPM bytes): 2=half size, 4=quarter size, etc.\n    mipmaps: tuple[tuple[int, bytes], ...] = ()\n',
              '    # (display zoom level, PPM bytes), independently rasterized from vectors.\n    exact_rasters: tuple[tuple[float, bytes], ...] = ()\n',
              1,
          )
          start = s.index('    mipmaps: list[tuple[int, bytes]] = []\n')
          end = s.index('\n    return RasterResult(', start)
          replacement = textwrap.dedent('''
              exact_rasters: list[tuple[float, bytes]] = []
              for zoom_level, ratio in req.exact_levels:
                  zoom_level = float(zoom_level)
                  ratio = float(ratio)
                  if ratio <= 0.0:
                      continue
                  if abs(ratio - 1.0) < 1e-12:
                      exact_rasters.append((zoom_level, ppm))
                      continue
                  exact_req = RasterRequest(
                      generation=req.generation,
                      zone_map=req.zone_map,
                      canvas_width=max(1, int(round(req.canvas_width * ratio))),
                      canvas_height=max(1, int(round(req.canvas_height * ratio))),
                      buffer_px=max(0, int(round(req.buffer_px * ratio))),
                      scale=req.scale * ratio,
                      offset_x=req.offset_x * ratio,
                      offset_y=req.offset_y * ratio,
                      enabled_layers=req.enabled_layers,
                      theme_id=req.theme_id,
                      elevation_enabled=req.elevation_enabled,
                      elevation_z=req.elevation_z,
                      elevation_span=req.elevation_span,
                      line_width=max(1, int(round(req.line_width * ratio))),
                      exact_levels=(),
                  )
                  exact_result = render_map_raster(exact_req)
                  exact_rasters.append((zoom_level, exact_result.ppm))
          ''').lstrip('\n')
          s = s[:start] + replacement + s[end:]
          s = s.replace('        mipmaps=tuple(mipmaps),\n', '        exact_rasters=tuple(exact_rasters),\n', 1)
          if 'exact_rasters=tuple(exact_rasters)' not in s:
              raise SystemExit('failed to patch mapraster return')
          p.write_text(s, encoding='utf-8')

          # mapview.py
          p = Path('eqquest/mapview.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from fractions import Fraction\n', '', 1)

          old = (
              '        self._wall_scaled_cache: dict[tuple[int, int, int], tk.PhotoImage] = {}\n'
              '        self._wall_mip_photos: dict[int, tk.PhotoImage] = {}\n'
          )
          new = (
              '        # Exact vector-derived wall images keyed by discrete map zoom level.\n'
              '        # Wheel zoom only swaps one cached PhotoImage; it never rescales it.\n'
              '        self._wall_exact_photos: dict[float, tk.PhotoImage] = {}\n'
          )
          if old not in s:
              raise SystemExit('viewer wall cache declaration not found')
          s = s.replace(old, new, 1)

          old = '        self._wall_scaled_cache.clear()\n        self._wall_mip_photos.clear()\n'
          if old not in s:
              raise SystemExit('viewer cache reset not found')
          s = s.replace(old, '        self._wall_exact_photos.clear()\n', 1)

          old = '            line_width=factor,\n            mip_levels=3,\n            elevation_enabled=enabled_z,\n'
          new = (
              '            line_width=factor,\n'
              '            exact_levels=tuple((level, level / factor) for level in MAP_ZOOM_LEVELS),\n'
              '            elevation_enabled=enabled_z,\n'
          )
          if old not in s:
              raise SystemExit('viewer raster request block not found')
          s = s.replace(old, new, 1)

          old = (
              '        self._raster_photo = photo\n'
              '        self._display_photo = None\n'
              '        self._wall_scaled_cache.clear()\n'
              '        self._wall_mip_photos = {1: photo}\n'
              '        for divisor, mip_ppm in result.mipmaps:\n'
              '            try:\n'
              '                self._wall_mip_photos[int(divisor)] = tk.PhotoImage(data=mip_ppm, format="PPM")\n'
              '            except tk.TclError:\n'
              '                continue\n'
          )
          new = (
              '        self._raster_photo = photo\n'
              '        self._display_photo = None\n'
              '        self._wall_exact_photos = {float(factor): photo}\n'
              '        for zoom_level, zoom_ppm in result.exact_rasters:\n'
              '            level = float(zoom_level)\n'
              '            if abs(level - float(factor)) < 1e-12:\n'
              '                continue\n'
              '            try:\n'
              '                self._wall_exact_photos[level] = tk.PhotoImage(data=zoom_ppm, format="PPM")\n'
              '            except tk.TclError:\n'
              '                continue\n'
          )
          if old not in s:
              raise SystemExit('viewer raster install block not found')
          s = s.replace(old, new, 1)

          start = s.index('    def _scaled_wall_photo(self) -> tk.PhotoImage | None:')
          end = s.index('    def _refresh_wall_display(self) -> None:', start)
          replacement = textwrap.dedent('''
              def _scaled_wall_photo(self) -> tk.PhotoImage | None:
                  """Return the exact vector-derived image for the current discrete zoom."""
                  if not self._wall_exact_photos:
                      return self._raster_photo
                  current_level = self.scale / max(self._wall_fit_scale, 1e-9)
                  level = min(self._wall_exact_photos, key=lambda value: abs(value - current_level))
                  return self._wall_exact_photos[level]

          ''').lstrip('\n')
          replacement = ''.join(('    ' + line if line.strip() else line) for line in replacement.splitlines(True))
          s = s[:start] + replacement + s[end:]

          old = '                f"{result.source_lines:,} source lines | {factor}x source image"\n'
          new = '                f"{result.source_lines:,} source lines | {len(self._wall_exact_photos)} exact zoom images"\n'
          if old not in s:
              raise SystemExit('viewer status line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # tests/test_mapraster.py
          p = Path('tests/test_mapraster.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    def test_vector_mips_keep_diagonal_continuous(self) -> None:')
          end = s.index('\nif __name__ ==', start)
          replacement = textwrap.dedent('''
              def test_exact_zoom_rasters_exist_at_requested_sizes(self) -> None:
                  layer = MapLayer(0, Path('diagonal.txt'))
                  layer.lines.append(MapLine(0, 0, 0, 31, 31, 0, 255, 0, 0))
                  zone = ZoneMap('diagonal', Path('.'), {0: layer})
                  req = RasterRequest(
                      generation=9,
                      zone_map=zone,
                      canvas_width=128,
                      canvas_height=128,
                      buffer_px=0,
                      scale=4.0,
                      offset_x=0.0,
                      offset_y=0.0,
                      enabled_layers=(0,),
                      theme_id=MAP_THEME_STONE,
                      line_width=4,
                      exact_levels=((0.5, 0.125), (0.75, 0.1875), (1.0, 0.25), (4.0, 1.0)),
                  )
                  result = render_map_raster(req)
                  levels = [level for level, _ppm in result.exact_rasters]
                  self.assertEqual(levels, [0.5, 0.75, 1.0, 4.0])
                  sizes = []
                  for _level, ppm in result.exact_rasters:
                      _magic, dims, _maximum, _pixels = ppm.split(b'\\n', 3)
                      sizes.append(tuple(map(int, dims.split())))
                  self.assertEqual(sizes, [(16, 16), (24, 24), (32, 32), (128, 128)])

          ''').lstrip('\n')
          replacement = ''.join(('    ' + line if line.strip() else line) for line in replacement.splitlines(True))
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Compile and test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v
          grep -q 'exact_levels=tuple((level, level / factor) for level in MAP_ZOOM_LEVELS)' eqquest/mapview.py
          if grep -A12 'def _scaled_wall_photo' eqquest/mapview.py | grep -q -- '-subsample'; then
            echo 'Tk subsample remains in wheel zoom path' >&2
            exit 1
          fi

      - name: Commit exact zoom cache
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/mapview.py eqquest/mapraster.py tests/test_mapraster.py
          git rm .github/workflows/apply-exact-map-zoom-cache.yml
          git commit -m "Cache exact vector raster for every map zoom level"
          git push
