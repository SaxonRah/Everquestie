name: PR canonical zone travel validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/zone_travel.py'
      - 'eqquest/zone_catalog.py'
      - 'eqquest/knowledge_build.py'
      - 'eqquest/knowledge_snapshot.py'
      - 'tools/build_map_catalog.py'
      - 'tests/test_zone_travel.py'
      - '.github/workflows/pr-zone-travel.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run zone travel tests
        run: python -m unittest tests.test_zone_travel -v
      - name: Run builder and snapshot regressions
        run: python -m unittest tests.test_knowledge_build tests.test_knowledge_snapshot tests.test_zone_catalog -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
