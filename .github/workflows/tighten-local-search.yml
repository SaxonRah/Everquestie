name: Tighten local search implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-local-search.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten ranking hot path
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/local_search.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from typing import Iterable\n\n', '')
          old = '''    aliases = [str(a["normalized_alias"]) for a in db.aliases_for_entity(int(row["id"]))]
          '''.replace('\n          ', '\n')
          new = '''    aliases = (
              [str(a["normalized_alias"]) for a in db.aliases_for_entity(int(row["id"]))]
              if norm else []
          )
          '''.replace('\n          ', '\n')
          if old not in s:
              raise SystemExit('alias ranking anchor missing')
          s = s.replace(old, new, 1)
          old = '''    sql += " ORDER BY e.kind, e.name LIMIT ?"
          args.append(candidate_limit)
          '''.replace('\n          ', '\n')
          new = '''    if use_fts:
              sql += " ORDER BY fts_rank, e.kind, e.name LIMIT ?"
          else:
              sql += " ORDER BY e.kind, e.name LIMIT ?"
          args.append(candidate_limit)
          '''.replace('\n          ', '\n')
          if old not in s:
              raise SystemExit('candidate ordering anchor missing')
          s = s.replace(old, new, 1)
          old = '''        if use_fts:
              return search_local_hits(
                  db,
                  LocalQuery(query.text, query.kinds, query.zone, query.source, query.exact),
                  default_kind=default_kind,
                  current_zone=current_zone,
                  limit=limit,
                  offset=offset,
              ) if False else _search_like_fallback(db, query, default_kind, current_zone, limit, offset)
          '''.replace('\n          ', '\n')
          new = '''        if use_fts:
              return _search_like_fallback(db, query, default_kind, current_zone, limit, offset)
          '''.replace('\n          ', '\n')
          if old not in s:
              raise SystemExit('fallback anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v
      - name: Commit
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/local_search.py
          git rm .github/workflows/tighten-local-search.yml
          git commit -m "Tighten local search ranking performance"
          git push
