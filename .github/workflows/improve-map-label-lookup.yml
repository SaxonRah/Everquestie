name: Improve map label lookup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/improve-map-label-lookup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize decorated map labels before local DB lookup
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/mapview.py')
          s = p.read_text(encoding='utf-8')
          if 'import re\n' not in s:
              s = s.replace('import queue\n', 'import queue\nimport re\n', 1)
          start = s.index('    def _lookup_candidates(')
          end = s.index('    def _lookup_name(', start)
          new = r'''    @staticmethod
              def _map_lookup_terms(term: str) -> list[str]:
                  """Return useful canonical guesses for decorated community-map labels."""
                  raw = " ".join((term or "").replace("_", " ").split()).strip()
                  if not raw:
                      return []
                  variants: list[str] = []

                  def add(value: str) -> None:
                      value = " ".join(value.split()).strip(" -*?:;,.[]{}")
                      if value and value.casefold() not in {v.casefold() for v in variants}:
                          variants.append(value)

                  add(raw)
                  # Zone-line labels are commonly "To <zone>", "Exit to <zone>", etc.
                  add(re.sub(r"^(?:zone\s+to|exit\s+to|entrance\s+to|to)\s+", "", raw, flags=re.I))
                  # Good/Brewall annotations often append role/quest notes such as (Q),
                  # (honeytender), (merchant), or author commentary. Try the clean name too.
                  no_paren = re.sub(r"\s*\([^)]*\)\s*$", "", raw).strip()
                  add(no_paren)
                  add(re.sub(r"^(?:zone\s+to|exit\s+to|entrance\s+to|to)\s+", "", no_paren, flags=re.I))
                  # Asterisks/question marks are also frequently map annotations.
                  add(re.sub(r"[?*]+$", "", no_paren).strip())
                  return variants

              def _lookup_candidates(self, term: str, preferred_entity_id: int | None = None):
                  terms = self._map_lookup_terms(term)
                  if not terms:
                      return []
                  rows = []
                  seen: set[int] = set()
                  if preferred_entity_id is not None:
                      row = self.db.entity(preferred_entity_id)
                      if row is not None:
                          rows.append(row)
                          seen.add(int(row["id"]))

                  # Prefer exact/alias matches from any cleaned variant before fuzzy FTS.
                  for candidate in terms:
                      exact, _status = self.db.resolve_entity(candidate)
                      if exact is not None and int(exact["id"]) not in seen:
                          rows.append(exact)
                          seen.add(int(exact["id"]))
                  for candidate in terms:
                      for row in self.db.search_entities_fts(candidate, limit=40):
                          eid = int(row["id"])
                          if eid not in seen:
                              rows.append(row)
                              seen.add(eid)
                          if len(rows) >= 40:
                              break
                      if len(rows) >= 40:
                          break
                  return rows[:40]

          '''
          # Dedent the embedded method block from workflow indentation.
          import textwrap
          new = textwrap.dedent(new)
          # Re-indent at class level.
          new = ''.join(('    ' + line if line.strip() else line) for line in new.splitlines(True))
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Compile and test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v
      - name: Commit lookup improvement
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/mapview.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize decorated map labels for local lookup"
          git push
