name: Apply authoritative zone joins

on:
  push:
    branches:
      - agent/authoritative-zone-joins

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused source edits
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "eqquest/travel.py": [
                  (
                      "from .zone_identity import resolve_zone\n",
                      "from .zone_authority import resolve_authoritative_zone\n",
                  ),
                  (
                      "    resolution = resolve_zone(db, text)\n",
                      "    resolution = resolve_authoritative_zone(db, text)\n",
                  ),
              ],
              "eqquest/zone_context.py": [
                  (
                      "from .zone_identity import ZoneIdentity, ZoneIdentityIndex\n",
                      "from .zone_authority import resolve_authoritative_zone\nfrom .zone_identity import ZoneIdentity\n",
                  ),
                  (
                      "    resolution = ZoneIdentityIndex(db).resolve(zone_token)\n",
                      "    resolution = resolve_authoritative_zone(db, zone_token)\n",
                  ),
              ],
              "eqquest/route_guidance.py": [
                  (
                      "from .zone_identity import resolve_zone\n",
                      "from .zone_authority import resolve_authoritative_zone\n",
                  ),
                  (
                      "    resolution = resolve_zone(db, text)\n",
                      "    resolution = resolve_authoritative_zone(db, text)\n",
                  ),
              ],
              "eqquest/zone_catalog.py": [
                  (
                      "from .eqmap import normalize_map_name\nfrom .zone_identity import SHORT_NAME_KEYS, ZoneIdentity, ZoneIdentityIndex\n",
                      "from .eqmap import normalize_map_name\nfrom .zone_authority import prefer_eqclient_zone_resolution\nfrom .zone_identity import SHORT_NAME_KEYS, ZoneIdentity, ZoneIdentityIndex\n",
                  ),
                  (
                      "        resolved = identities.resolve(\n            map_stem,\n            allow_significant_word=True,\n            allow_containment=True,\n        )\n",
                      "        resolved = identities.resolve(\n            map_stem,\n            allow_significant_word=True,\n            allow_containment=True,\n        )\n        resolved = prefer_eqclient_zone_resolution(resolved, map_stem)\n",
                  ),
              ],
              "eqquest/zone_travel.py": [
                  (
                      "from .eqmap import map_to_game\nfrom .zone_identity import ZoneIdentityIndex\n",
                      "from .eqmap import map_to_game\nfrom .zone_authority import prefer_eqclient_zone_resolution\nfrom .zone_identity import ZoneIdentityIndex\n",
                  ),
                  (
                      "        resolved = identities.resolve(destination)\n",
                      "        resolved = identities.resolve(destination)\n        resolved = prefer_eqclient_zone_resolution(resolved, destination)\n",
                  ),
              ],
          }

          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{name}: expected exactly one match, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
      - name: Commit edits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eqquest/travel.py eqquest/zone_context.py eqquest/route_guidance.py eqquest/zone_catalog.py eqquest/zone_travel.py
          git commit -m "Use EQ-client authority for canonical zone joins"
          git push origin HEAD:agent/authoritative-zone-joins
