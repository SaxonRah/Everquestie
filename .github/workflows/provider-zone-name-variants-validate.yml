name: Provider zone name variant validation

on:
  push:
    branches:
      - agent/provider-zone-name-variants

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Focused provider reconciliation regressions
        run: python -m unittest tests.test_provider_zone_reconciliation tests.test_provider_zone_travel tests.test_provider_zone_travel_runtime tests.test_provider_zone_projection tests.test_canonical_provider_where -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
