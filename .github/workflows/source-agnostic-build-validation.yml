name: Source-agnostic knowledge build validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/knowledge_build.py'
      - 'tools/build_knowledge_db.py'
      - 'tools/build_map_catalog.py'
      - 'tools/finalize_knowledge_snapshot.py'
      - 'tests/test_knowledge_build.py'
      - 'tools/README.md'
      - '.github/workflows/source-agnostic-build-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Import builder modules
        run: python -c "import eqquest.knowledge_build; import eqquest.knowledge_snapshot; print('builder imports OK')"
      - name: Check documented builder CLIs
        run: |
          python tools/build_knowledge_db.py --help > /dev/null
          python tools/build_map_catalog.py --help > /dev/null
          python tools/finalize_knowledge_snapshot.py --help > /dev/null
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
