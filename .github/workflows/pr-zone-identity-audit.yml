name: PR zone identity audit

on:
  push:
    branches:
      - agent/zone-identity-frontier-audit

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run zone identity audit regressions
        run: python -m unittest tests.test_zone_identity_audit tests.test_zone_identity_audit_cli tests.test_zone_travel tests.test_zone_coverage tests.test_runtime_zone_map_ui -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
