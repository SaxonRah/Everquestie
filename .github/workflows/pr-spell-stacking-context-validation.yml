name: PR spell stacking context validation

on:
  push:
    branches:
      - agent/spell-stacking-context

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run stacking context regressions
        run: python -m unittest tests.test_spell_stacking_context -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
