name: PR route guidance validation

on:
  push:
    branches:
      - agent/route-next-hop-map

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run route guidance regressions
        run: python -m unittest tests.test_route_guidance tests.test_travel_view -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
