name: PR global zone mechanics validation

on:
  push:
    branches:
      - agent/global-mechanics-catalog

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-mechanics-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run canonical catalog tests
        run: python -m unittest tests.test_mechanics_catalog tests.test_zone_coverage -v
      - name: Run identity, snapshot and runtime regressions
        run: python -m unittest tests.test_mechanics_identity tests.test_knowledge_snapshot tests.test_runtime_database_split tests.test_zone_catalog tests.test_zone_travel -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
