name: PR builder navigation refresh

on:
  push:
    branches:
      - agent/refresh-derived-navigation-catalog

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run navigation refresh regressions
        run: python -m unittest tests.test_builder_navigation_refresh tests.test_travel_navigation_refresh_ui tests.test_authoritative_zone_joins tests.test_travel_view tests.test_route_guidance tests.test_zone_context tests.test_nearby -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
