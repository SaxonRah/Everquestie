name: PR route frontier build report

on:
  push:
    branches:
      - agent/route-frontier-build-report

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run route/frontier builder regressions
        run: python -m unittest tests.test_build_knowledge_cli tests.test_provider_travel_frontier tests.test_provider_travel_frontier_cli tests.test_route_acceptance tests.test_route_acceptance_cli tests.test_allakhazam_mirror_links tests.test_provider_zone_reconciliation tests.test_provider_zone_travel -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
