name: Fix cached wall sampling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-cached-wall-sampling.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pass supersample stroke width to wall raster
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/mapview.py')
          s = p.read_text(encoding='utf-8')
          old = '''            theme_id=self._map_theme_id(),\n            elevation_enabled=enabled_z,\n'''
          new = '''            theme_id=self._map_theme_id(),\n            line_width=factor,\n            elevation_enabled=enabled_z,\n'''
          if old not in s:
              raise SystemExit('RasterRequest construction pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Compile and test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v
          grep -q 'line_width=factor' eqquest/mapview.py
      - name: Commit fix
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/mapview.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Keep cached map wall strokes continuous"
          git push
