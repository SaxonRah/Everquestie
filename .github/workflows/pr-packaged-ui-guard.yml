name: PR packaged UI guard

on:
  push:
    branches:
      - agent/hide-packaged-search-entrypoints

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run packaged UI regressions
        run: python -m unittest tests.test_packaged_ui_policy tests.test_runtime_map_policy tests.test_runtime_route_guidance_policy tests.test_map_initial_fit -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
