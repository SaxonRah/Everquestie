name: PR Knowledge related locations

on:
  push:
    branches:
      - agent/knowledge-related-location-choices

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run related-location regressions
        run: python -m unittest tests.test_knowledge_related_location_choices tests.test_knowledge_location_choices tests.test_knowledge_map_target tests.test_world_entity_context tests.test_world_entity_knowledge_detail tests.test_canonical_provider_where tests.test_locations tests.test_vendor tests.test_knowledge_snapshot -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
