name: PR zone identity and map hint validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/sources/eqclient.py'
      - 'eqquest/zone_catalog.py'
      - 'tests/test_source_compatibility.py'
      - 'tests/test_zone_catalog.py'
      - '.github/workflows/pr-zone-identity-map-hints.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run focused zone identity tests
        run: python -m unittest tests.test_source_compatibility tests.test_zone_catalog -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
