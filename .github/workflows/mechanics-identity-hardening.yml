name: Mechanics identity hardening

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'tools/apply_mechanics_identity_hardening.py'
      - '.github/workflows/mechanics-identity-hardening.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mechanics identity hardening
        run: |
          python tools/apply_mechanics_identity_hardening.py
          python - <<'PY'
          from pathlib import Path
          import textwrap
          path = Path('tests/test_mechanics_identity.py')
          text = path.read_text(encoding='utf-8')
          if text.startswith('\\\n'):
              text = text[2:]
          path.write_text(textwrap.dedent(text).lstrip('\n'), encoding='utf-8')
          PY
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Import runtime modules
        run: python -c "import eqquest.app; import eqquest.mechanics; print('runtime imports OK')"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eqquest/mechanics.py tests/test_mechanics_identity.py
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Harden mechanics spell identity resolution"
            git push origin HEAD:agent/portable-manual-map-catalog
          fi
