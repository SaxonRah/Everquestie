name: Bootstrap staged source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble staged source files
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r target prefix; do
            [ -n "$target" ] || continue
            mkdir -p "$(dirname "$target")"
            mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name "${prefix}.part*" | sort)
            if [ "${#parts[@]}" -eq 0 ]; then
              echo "No staged parts found for $target ($prefix)" >&2
              exit 1
            fi
            cat "${parts[@]}" > "$target"
            echo "assembled $target from ${#parts[@]} part(s)"
          done < .bootstrap/manifest.txt
          rm -rf .bootstrap
      - name: Commit assembled source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Complete EverQuestie v0.13 source bootstrap"
          git push
