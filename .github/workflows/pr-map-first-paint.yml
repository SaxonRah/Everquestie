name: PR Map first paint

on:
  push:
    branches:
      - agent/map-tab-first-paint-and-nav-coverage

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run Map first-paint regressions
        run: python -m unittest tests.test_map_initial_fit tests.test_local_map_readiness_ui tests.test_runtime_zone_map_ui tests.test_runtime_map_policy -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
