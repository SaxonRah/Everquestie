name: PR knowledge normalization coverage

on:
  push:
    branches:
      - agent/knowledge-normalization-coverage-v2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run normalization coverage regressions
        run: >-
          python -m unittest
          tests.test_knowledge_coverage
          tests.test_knowledge_coverage_cli
          tests.test_knowledge_coverage_ui
          -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
