name: Apply global map and mechanics pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-local-map-mechanics-pass.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch map catalog for incremental indexing and entity navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/map_catalog.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from .eqmap import discover_base_maps, load_zone_map, normalize_map_name\n',
              'from .eqmap import discover_base_maps, map_to_game, normalize_map_name, parse_map_file\n',
              1,
          )

          start = s.index('    def index_root(self, root: str | Path) -> MapIndexStats:')
          end = s.index('    def stats(self, root: str | Path | None = None) -> dict[str, int]:', start)
          block = '''    def index_root(self, root: str | Path) -> MapIndexStats:
              root_path = Path(root).resolve()
              if not root_path.is_dir():
                  raise FileNotFoundError(root_path)
              root_s = str(root_path)
              zone_by_stem = self._zone_map()
              base_maps = discover_base_maps(root_path)
              seen_paths: set[str] = set()
              files_indexed = 0
              files_unchanged = 0

              with self.db.batch():
                  for base in base_maps:
                      map_stem = base.stem
                      zone_name = zone_by_stem.get(normalize_map_name(map_stem), "")
                      for layer_no in range(4):
                          path = root_path / (f"{map_stem}.txt" if layer_no == 0 else f"{map_stem}_{layer_no}.txt")
                          if not path.exists():
                              continue
                          path = path.resolve()
                          seen_paths.add(str(path))
                          stat = path.stat()
                          source_id, unchanged = self._upsert_source(
                              root=root_s,
                              map_stem=map_stem,
                              zone_name=zone_name,
                              layer=layer_no,
                              path=path,
                              mtime_ns=stat.st_mtime_ns,
                              size=stat.st_size,
                          )
                          if unchanged:
                              files_unchanged += 1
                              continue
                          files_indexed += 1
                          layer = parse_map_file(path, layer=layer_no)
                          self.db.conn.execute("DELETE FROM map_labels WHERE source_id=?", (source_id,))
                          rows = []
                          for point in layer.points:
                              raw = point.display_text
                              clean = self._canonical_text(raw)
                              rows.append(
                                  (
                                      source_id, map_stem, zone_name, layer_no, int(point.source_line),
                                      raw, clean, normalize_name(clean), float(point.x), float(point.y),
                                      float(point.z), int(point.r), int(point.g), int(point.b), int(point.size),
                                  )
                              )
                          if rows:
                              self.db.conn.executemany(
                                  """
                                  INSERT INTO map_labels(
                                      source_id,map_stem,zone_name,layer,source_line,
                                      raw_text,clean_text,normalized_text,x,y,z,r,g,b,size
                                  ) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)
                                  """,
                                  rows,
                              )

                  stale = self.db.conn.execute(
                      "SELECT id,path FROM map_sources WHERE root=?", (root_s,)
                  ).fetchall()
                  for row in stale:
                      if str(row["path"]) not in seen_paths:
                          self.db.conn.execute("DELETE FROM map_sources WHERE id=?", (int(row["id"]),))
                  self.db.set_meta("map_catalog_root", root_s)
                  if files_indexed or stale:
                      self.db.set_meta("map_links_dirty", "1")

              reconciliation = self.reconcile_all(force=bool(files_indexed))
              labels = int(
                  self.db.conn.execute(
                      "SELECT COUNT(*) FROM map_labels ml JOIN map_sources ms ON ms.id=ml.source_id WHERE ms.root=?",
                      (root_s,),
                  ).fetchone()[0]
              )
              return MapIndexStats(
                  base_maps=len(base_maps),
                  files_indexed=files_indexed,
                  files_unchanged=files_unchanged,
                  labels=labels,
                  linked=reconciliation["linked"],
                  ambiguous=reconciliation["ambiguous"],
                  unresolved=reconciliation["unresolved"],
              )

          '''
          # Preserve the method indentation in the literal above.
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          s = s[:start] + block + s[end:]

          marker = '    @staticmethod\n    def _hit(row, score: tuple, reason: str) -> MapCatalogHit:\n'
          if marker not in s:
              raise SystemExit('MapCatalog _hit marker missing')
          addition = '''    def hits_for_entity(self, entity_id: int, *, limit: int = 100) -> list[MapCatalogHit]:
              self.ensure_reconciled()
              rows = self.db.conn.execute(
                  """
                  SELECT ml.*,ms.path FROM map_labels ml
                  JOIN map_sources ms ON ms.id=ml.source_id
                  WHERE ml.linked_entity_id=?
                  ORDER BY CASE WHEN ml.zone_name<>'' THEN 0 ELSE 1 END,ml.zone_name,ml.map_stem,ml.layer,ml.source_line
                  LIMIT ?
                  """,
                  (int(entity_id), max(1, min(int(limit), 1000))),
              ).fetchall()
              return [self._hit(row, (0, i), "linked local map evidence") for i, row in enumerate(rows)]

          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          s = s.replace(marker, addition + marker, 1)

          if 'def map_evidence_lines(' not in s:
              s += '''\n\ndef map_evidence_lines(db: Database, entity_id: int, *, limit: int = 50) -> list[str]:
              """Render linked map-label evidence without turning it into entity-location truth."""
              try:
                  rows = db.conn.execute(
                      """
                      SELECT ml.*,ms.path FROM map_labels ml
                      JOIN map_sources ms ON ms.id=ml.source_id
                      WHERE ml.linked_entity_id=?
                      ORDER BY ml.zone_name,ml.map_stem,ml.layer,ml.source_line
                      LIMIT ?
                      """,
                      (int(entity_id), max(1, min(int(limit), 500))),
                  ).fetchall()
              except Exception:
                  return []
              if not rows:
                  return []
              lines = ["", "Local map evidence:"]
              for row in rows:
                  gx, gy, gz = map_to_game(float(row["x"]), float(row["y"]), float(row["z"]))
                  zone = str(row["zone_name"] or row["map_stem"])
                  lines.append(
                      f"  • {row['raw_text']} | {zone} | /loc Y {gy:g}, X {gx:g}, Z {gz:g} | "
                      f"layer {row['layer']} | {Path(str(row['path'])).name}:{row['source_line']}"
                  )
              return lines
          '''
              # Undo workflow indentation only for the appended function literal.
              prefix, tail = s.rsplit('\n\ndef map_evidence_lines', 1)
              tail = '\n\ndef map_evidence_lines' + tail
              tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in tail.splitlines())
              s = prefix + tail + '\n'

          p.write_text(s, encoding='utf-8')

      - name: Patch Knowledge vendor and map evidence rendering
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/knowledge.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from .detail_renderers import render_structured_local_detail\n',
              'from .detail_renderers import render_structured_local_detail\nfrom .map_catalog import map_evidence_lines\nfrom .vendor import VENDOR_RELATIONS, vendor_section_lines\n',
              1,
          )
          s = s.replace(
              '    "starts_in": "Starts in",\n',
              '    "starts_in": "Starts in",\n    "sells": "Sells",\n    "teaches_spell": "Teaches spell",\n    "trains_skill": "Trains skill",\n',
              1,
          )
          anchor = '    lines.extend(_render_local_detail(db, entity_id, str(r["kind"])))\n\n    locs = db.locations_for_entity(entity_id)\n'
          replacement = '    lines.extend(_render_local_detail(db, entity_id, str(r["kind"])))\n    lines.extend(vendor_section_lines(db, entity_id))\n    lines.extend(map_evidence_lines(db, entity_id))\n\n    locs = db.locations_for_entity(entity_id)\n'
          if anchor not in s:
              raise SystemExit('Knowledge detail insertion anchor missing')
          s = s.replace(anchor, replacement, 1)
          anchor = '    rels = db.relationships_for_entity(entity_id)\n    if rels:\n'
          replacement = '    rels = [rel for rel in db.relationships_for_entity(entity_id) if str(rel["relation"]) not in VENDOR_RELATIONS]\n    if rels:\n'
          if anchor not in s:
              raise SystemExit('Knowledge relationships anchor missing')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')

      - name: Patch application Mechanics tab and Knowledge navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/app.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from .mapview import MapViewerFrame\n',
              'from .mapview import MapViewerFrame\nfrom .mechanics import MechanicsFrame\n',
              1,
          )
          anchor = '        self.knowledge_tab = ttk.Frame(notebook, padding=8, style="Stone.TFrame")\n        self.search_tab = ttk.Frame(notebook, padding=8, style="Stone.TFrame")\n'
          replacement = '        self.knowledge_tab = ttk.Frame(notebook, padding=8, style="Stone.TFrame")\n        self.mechanics_tab = ttk.Frame(notebook, style="Stone.TFrame")\n        self.search_tab = ttk.Frame(notebook, padding=8, style="Stone.TFrame")\n'
          if anchor not in s:
              raise SystemExit('app tab declaration anchor missing')
          s = s.replace(anchor, replacement, 1)
          anchor = '        notebook.add(self.knowledge_tab, text="Knowledge")\n        notebook.add(self.search_tab, text="Search")\n'
          replacement = '        notebook.add(self.knowledge_tab, text="Knowledge")\n        notebook.add(self.mechanics_tab, text="Mechanics")\n        notebook.add(self.search_tab, text="Search")\n'
          if anchor not in s:
              raise SystemExit('app notebook add anchor missing')
          s = s.replace(anchor, replacement, 1)
          anchor = '        self._build_knowledge()\n        self._build_search()\n'
          replacement = '        self._build_knowledge()\n        self._build_mechanics()\n        self._build_search()\n'
          if anchor not in s:
              raise SystemExit('app build call anchor missing')
          s = s.replace(anchor, replacement, 1)

          marker = '    def _build_search(self):\n'
          if marker not in s:
              raise SystemExit('app _build_search marker missing')
          addition = '''    def _build_mechanics(self):
              self.mechanics_tab.rowconfigure(0, weight=1)
              self.mechanics_tab.columnconfigure(0, weight=1)
              self.mechanics_view = MechanicsFrame(self.mechanics_tab, db=self.db)
              self.mechanics_view.grid(row=0, column=0, sticky="nsew")

          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          s = s.replace(marker, addition + marker, 1)

          start = s.index('    def _map_entity_selected(self, entity_id: int):')
          end = s.index('    def _map_label_to_knowledge(self, term: str) -> None:', start)
          block = '''    def _map_entity_selected(self, entity_id: int):
              row = self.db.entity(entity_id)
              if row is None:
                  return
              self.search_var.set(row["name"])
              self.kind_var.set(row["kind"])
              self._search_knowledge()
              self.notebook.select(self.knowledge_tab)
              iid = f"entity:{entity_id}"
              if not hasattr(self, "entity_tree"):
                  return
              if not self.entity_tree.exists(iid):
                  kind_node = self._knowledge_kind_nodes.get(str(row["kind"]))
                  if kind_node and self.entity_tree.exists(kind_node):
                      self._populate_knowledge_kind(str(row["kind"]), kind_node)
              if not self.entity_tree.exists(iid):
                  return
              self.entity_tree.selection_set(iid)
              self.entity_tree.focus(iid)
              self.entity_tree.see(iid)
              self._show_entity()

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Patch Map viewer global catalog UI and navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('eqquest/mapview.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from .map_search import MapLabelHit, find_map_label_hits\n',
              'from .map_search import MapLabelHit, find_map_label_hits\nfrom .map_catalog import MapCatalog, MapCatalogHit\n',
              1,
          )
          anchor = '        self.on_entity = on_entity\n        self.on_knowledge_search = on_knowledge_search\n\n        self.map_root = tk.StringVar'
          replacement = '        self.on_entity = on_entity\n        self.on_knowledge_search = on_knowledge_search\n        self.map_catalog = MapCatalog(db)\n\n        self.map_root = tk.StringVar'
          if anchor not in s:
              raise SystemExit('MapViewer catalog constructor anchor missing')
          s = s.replace(anchor, replacement, 1)

          anchor = '        self._lookup_entity_by_item: dict[str, int] = {}\n        self._lookup_map_hit_by_item: dict[str, MapLabelHit] = {}\n        self._lookup_selected_entity: int | None = None\n        self._lookup_selected_map_hit: MapLabelHit | None = None\n'
          replacement = '        self._lookup_entity_by_item: dict[str, int] = {}\n        self._lookup_map_hit_by_item: dict[str, MapLabelHit | MapCatalogHit] = {}\n        self._lookup_selected_entity: int | None = None\n        self._lookup_selected_map_hit: MapLabelHit | MapCatalogHit | None = None\n        self._catalog_index_results: queue.Queue[tuple[str, object]] = queue.Queue()\n        self._catalog_indexing = False\n'
          if anchor not in s:
              raise SystemExit('MapViewer lookup state anchor missing')
          s = s.replace(anchor, replacement, 1)

          anchor = '        self.after(30, self._poll_raster_results)\n        self.after(250, self._poll_state)\n'
          replacement = '        self.after(30, self._poll_raster_results)\n        self.after(250, self._poll_state)\n        self.after(300, self._poll_catalog_index_results)\n        self.after(700, self.ensure_map_catalog)\n'
          if anchor not in s:
              raise SystemExit('MapViewer after anchor missing')
          s = s.replace(anchor, replacement, 1)

          anchor = '        ttk.Button(lookup_row, text="Search", command=lambda: self._lookup_name(self.lookup_query.get())).grid(row=0, column=1, padx=(4, 0))\n'
          replacement = anchor + '        ttk.Button(lookup_row, text="Index maps", command=self.index_map_catalog).grid(row=0, column=2, padx=(4, 0))\n'
          if anchor not in s:
              raise SystemExit('MapViewer lookup button anchor missing')
          s = s.replace(anchor, replacement, 1)

          anchor = '        ttk.Button(lookup_actions, text="Open in Knowledge", command=self._open_lookup_in_knowledge).pack(side="left")\n        ttk.Label(lookup_actions, textvariable=self.lookup_status).pack(side="left", padx=(6, 0))\n'
          replacement = '        ttk.Button(lookup_actions, text="Open in Knowledge", command=self._open_lookup_in_knowledge).pack(side="left")\n        ttk.Button(lookup_actions, text="Open Map", command=self._open_lookup_on_map).pack(side="left", padx=(5, 0))\n        ttk.Label(lookup_actions, textvariable=self.lookup_status).pack(side="left", padx=(6, 0))\n'
          if anchor not in s:
              raise SystemExit('MapViewer lookup action anchor missing')
          s = s.replace(anchor, replacement, 1)

          anchor = '        count = len(discover_base_maps(root))\n        self.map_status.set(f"Map pack: {Path(root).name} | {count} base map files")\n\n    def suggest_root_from_log'
          replacement = '        count = len(discover_base_maps(root))\n        self.map_status.set(f"Map pack: {Path(root).name} | {count} base map files")\n        self.after(50, self.ensure_map_catalog)\n\n    def suggest_root_from_log'
          if anchor not in s:
              raise SystemExit('MapViewer set root anchor missing')
          s = s.replace(anchor, replacement, 1)

          marker = '    def suggest_root_from_log(self, log_path: str | Path) -> None:\n'
          if marker not in s:
              raise SystemExit('MapViewer suggest_root marker missing')
          addition = '''    def ensure_map_catalog(self) -> None:
              root = self.map_root.get().strip()
              if not root or not Path(root).is_dir() or self._catalog_indexing:
                  return
              # Always run the lightweight fingerprint pass; unchanged map files are
              # stat-checked but not reparsed.
              self.index_map_catalog()

              def index_map_catalog(self) -> None:
                  root = self.map_root.get().strip()
                  if not root or not Path(root).is_dir():
                      self.lookup_status.set("Choose a valid map pack before indexing.")
                      return
                  if self._catalog_indexing:
                      self.lookup_status.set("Map catalog indexing is already running.")
                      return
                  self._catalog_indexing = True
                  self.lookup_status.set("Indexing local map labels…")
                  db_path = self.db.path

                  def worker() -> None:
                      thread_db = None
                      try:
                          thread_db = Database(db_path)
                          stats = MapCatalog(thread_db).index_root(root)
                          self._catalog_index_results.put(("ok", stats))
                      except Exception as exc:
                          self._catalog_index_results.put(("error", str(exc)))
                      finally:
                          if thread_db is not None:
                              thread_db.close()

                  threading.Thread(target=worker, name="EverQuestieMapCatalog", daemon=True).start()

              def _poll_catalog_index_results(self) -> None:
                  try:
                      while True:
                          status, payload = self._catalog_index_results.get_nowait()
                          self._catalog_indexing = False
                          if status == "ok":
                              stats = payload
                              self.lookup_status.set(
                                  f"Map catalog: {stats.labels:,} labels | {stats.linked:,} linked | "
                                  f"{stats.ambiguous:,} ambiguous"
                              )
                          else:
                              self.lookup_status.set(f"Map catalog index failed: {payload}")
                  except queue.Empty:
                      pass
                  self.after(300, self._poll_catalog_index_results)

          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          s = s.replace(marker, addition + marker, 1)

          # Replace detail + search-summary methods together.
          start = s.index('    def _map_label_detail_text(self, hit: MapLabelHit) -> str:')
          end = s.index('    def _lookup_name(self, term: str, preferred_entity_id: int | None = None) -> None:', start)
          block = '''    def _map_label_detail_text(self, hit: MapLabelHit | MapCatalogHit) -> str:
              gx, gy, gz = map_to_game(hit.x, hit.y, hit.z)
              if isinstance(hit, MapCatalogHit):
                  zone = hit.zone_name or hit.map_stem
                  lines = [
                      f"[map label] {hit.text}",
                      f"Zone/map: {zone}",
                      f"Map stem: {hit.map_stem}",
                      f"Layer: {hit.layer}",
                      f"EQ /loc: Y {gy:.1f}, X {gx:.1f}, Z {gz:.1f}",
                      f"Map file: {Path(hit.path).name}",
                      f"Map source line: {hit.source_line}",
                      f"Catalog link: {hit.link_status}" + (f" — {hit.link_reason}" if hit.link_reason else ""),
                  ]
                  if hit.linked_entity_id is not None:
                      entity = self.db.entity(hit.linked_entity_id)
                      if entity is not None:
                          lines += ["", f"Linked local entity: [{entity['kind']}] {entity['name']}"]
                  else:
                      lines += [
                          "",
                          "Local map evidence only — no normalized EverQuestie knowledge entity is linked yet.",
                          "The map label remains unclassified; EverQuestie will not guess NPC/item/quest semantics.",
                      ]
                  return "\\n".join(lines)

              zone = self.get_zone() or self.manual_zone.get().strip() or (self.zone_map.stem if self.zone_map else "unknown")
              layer_path = None
              if self.zone_map is not None and hit.layer in self.zone_map.layers:
                  layer_path = self.zone_map.layers[hit.layer].path.name
              lines = [
                  f"[map label] {hit.text}",
                  f"Zone: {zone}",
                  f"Layer: {hit.layer}",
                  f"EQ /loc: Y {gy:.1f}, X {gx:.1f}, Z {gz:.1f}",
              ]
              if layer_path:
                  lines.append(f"Map file: {layer_path}")
              if hit.source_line:
                  lines.append(f"Map source line: {hit.source_line}")
              lines += [
                  "",
                  "Local map evidence only — no normalized EverQuestie knowledge entity matches this label yet.",
                  "The map file does not encode whether this name is an NPC, quest, merchant, item, or another POI, so EverQuestie will not invent a type.",
              ]
              return "\\n".join(lines)

              def map_label_search_summary(self, term: str, *, limit: int = 20) -> list[str]:
                  lines: list[str] = []
                  catalog_hits = self.map_catalog.search(term, current_zone=self.get_zone(), limit=limit)
                  if catalog_hits:
                      for hit in catalog_hits:
                          gx, gy, gz = map_to_game(hit.x, hit.y, hit.z)
                          zone = hit.zone_name or hit.map_stem
                          linked = f" | linked entity {hit.linked_entity_id}" if hit.linked_entity_id is not None else ""
                          lines.append(
                              f"[map label] {hit.text} | {zone} | layer {hit.layer} | "
                              f"/loc Y {gy:.1f}, X {gx:.1f}, Z {gz:.1f} | {hit.reason}{linked}"
                          )
                      return lines
                  for hit in self.map_label_matches(term, limit=limit):
                      gx, gy, gz = map_to_game(hit.x, hit.y, hit.z)
                      lines.append(
                          f"[map label] {hit.text} | current map layer {hit.layer} | /loc Y {gy:.1f}, X {gx:.1f}, Z {gz:.1f} | {hit.reason}"
                      )
                  return lines

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          s = s[:start] + block + s[end:]

          lookup_start = s.index('    def _lookup_name(self, term: str, preferred_entity_id: int | None = None) -> None:')
          nohit_start = s.index('        if not hits:', lookup_start)
          nohit_end = s.index('        for hit in hits:', nohit_start)
          nohit = '''        if not hits:
              catalog_hits = self.map_catalog.search(term, current_zone=self.get_zone(), limit=40)
              if catalog_hits:
                  for index, hit in enumerate(catalog_hits):
                      iid = f"catalog:{hit.label_id}:{index}"
                      kind = "map label"
                      if hit.linked_entity_id is not None:
                          linked = self.db.entity(hit.linked_entity_id)
                          if linked is not None:
                              kind = f"map→{linked['kind']}"
                      self.lookup_tree.insert("", "end", iid=iid, text=hit.text, values=(kind, hit.reason))
                      self._lookup_map_hit_by_item[iid] = hit
                  first = self.lookup_tree.get_children()[0]
                  self.lookup_tree.selection_set(first)
                  self.lookup_tree.focus(first)
                  self.lookup_tree.see(first)
                  self._lookup_selected_map_hit = self._lookup_map_hit_by_item[first]
                  self.lookup_status.set(
                      f"{len(catalog_hits)} global map evidence match" + ("es" if len(catalog_hits) != 1 else "")
                  )
                  self._set_lookup_detail(self._map_label_detail_text(self._lookup_selected_map_hit))
                  return
              map_hits = self.map_label_matches(term, limit=20)
              if map_hits:
                  for index, hit in enumerate(map_hits):
                      iid = f"maplabel:{index}"
                      self.lookup_tree.insert("", "end", iid=iid, text=hit.text, values=("map label", hit.reason))
                      self._lookup_map_hit_by_item[iid] = hit
                  first = self.lookup_tree.get_children()[0]
                  self.lookup_tree.selection_set(first)
                  self.lookup_tree.focus(first)
                  self.lookup_tree.see(first)
                  self._lookup_selected_map_hit = self._lookup_map_hit_by_item[first]
                  self.lookup_status.set(
                      f"No normalized DB entity; {len(map_hits)} current-map label candidate" +
                      ("s" if len(map_hits) != 1 else "")
                  )
                  self._set_lookup_detail(self._map_label_detail_text(self._lookup_selected_map_hit))
                  return
              self.lookup_status.set("No local DB or indexed/current-map label match")
              self._set_lookup_detail(f"No local EverQuestie knowledge or map evidence matches: {term}")
              return
          '''
          nohit = '\n'.join(line[10:] if line.startswith('          ') else line for line in nohit.splitlines()) + '\n'
          s = s[:nohit_start] + nohit + s[nohit_end:]

          start = s.index('    def _open_lookup_in_knowledge(self, _event=None) -> None:')
          end = s.index('    # ------------------------------------------------------------------\n    # Map-only visual themes', start)
          block = '''    def _open_lookup_in_knowledge(self, _event=None) -> None:
              if self._lookup_selected_entity is not None and self.on_entity:
                  self.on_entity(self._lookup_selected_entity)
                  return
              if isinstance(self._lookup_selected_map_hit, MapCatalogHit):
                  if self._lookup_selected_map_hit.linked_entity_id is not None and self.on_entity:
                      self.on_entity(self._lookup_selected_map_hit.linked_entity_id)
                      return
              term = ""
              if self._lookup_selected_map_hit is not None:
                  term = self._lookup_selected_map_hit.text
              else:
                  term = self.lookup_query.get().strip()
              if term and self.on_knowledge_search:
                  self.on_knowledge_search(term)

              def _center_map_point(self, x: float, y: float) -> None:
                  new_x = self.canvas.winfo_width() * 0.5 - float(x) * self.scale
                  new_y = self.canvas.winfo_height() * 0.5 - float(y) * self.scale
                  self._move_view_to(new_x, new_y)
                  self._schedule_save_view()

              def _open_lookup_on_map(self, _event=None) -> None:
                  hit = self._lookup_selected_map_hit
                  if isinstance(hit, MapCatalogHit):
                      try:
                          self.load_map(hit.path)
                      except Exception as exc:
                          self.lookup_status.set(f"Could not open indexed map: {exc}")
                          return
                      self.after(80, lambda: self._center_map_point(hit.x, hit.y))
                      self.lookup_status.set(
                          f"Opened {hit.zone_name or hit.map_stem} at {hit.text}"
                      )
                      return
                  if isinstance(hit, MapLabelHit):
                      self._center_map_point(hit.x, hit.y)
                      return
                  if self._lookup_selected_entity is not None:
                      map_hits = self.map_catalog.hits_for_entity(self._lookup_selected_entity, limit=20)
                      if map_hits:
                          chosen = map_hits[0]
                          current = normalize_map_name(self.get_zone() or "")
                          for candidate in map_hits:
                              if current and current in {
                                  normalize_map_name(candidate.zone_name), normalize_map_name(candidate.map_stem)
                              }:
                                  chosen = candidate
                                  break
                          self.load_map(chosen.path)
                          self.after(80, lambda: self._center_map_point(chosen.x, chosen.y))
                          self.lookup_status.set(
                              f"Opened linked map evidence for {chosen.text}"
                          )
                          return
                      self.focus_entity(self._lookup_selected_entity)

          '''
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          s = s[:start] + block + s[end:]

          p.write_text(s, encoding='utf-8')

      - name: Compile and test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v
          python -c "import eqquest.app, eqquest.map_catalog, eqquest.mechanics, eqquest.vendor; print('feature imports OK')"

      - name: Commit integration
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/map_catalog.py eqquest/mapview.py eqquest/app.py eqquest/knowledge.py eqquest/mechanics.py eqquest/vendor.py tests/test_map_catalog.py tests/test_vendor.py
          git rm .github/workflows/apply-local-map-mechanics-pass.yml
          git commit -m "Index global map evidence and expose local mechanics"
          git push
