name: PR current zone dashboard

on:
  push:
    branches:
      - agent/current-zone-dashboard

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run current-zone dashboard regressions
        run: python -m unittest tests.test_current_zone_dashboard tests.test_knowledge_relationship_navigation tests.test_knowledge_related_location_choices tests.test_knowledge_route_location tests.test_zone_context tests.test_zone_actionability tests.test_route_guidance_ui tests.test_runtime_database_split tests.test_knowledge_snapshot -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
