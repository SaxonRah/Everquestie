name: PR zone context actionability validation

on:
  push:
    branches:
      - agent/zone-context-actionability

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run zone actionability regressions
        run: python -m unittest tests.test_zone_actionability tests.test_zone_context tests.test_route_guidance_evidence tests.test_zone_coverage -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
