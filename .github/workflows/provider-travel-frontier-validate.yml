name: Provider travel frontier validation

on:
  push:
    branches:
      - agent/provider-travel-frontier-audit

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Focused provider frontier tests
        run: python -m unittest tests.test_provider_travel_frontier tests.test_provider_travel_frontier_cli tests.test_provider_zone_travel tests.test_provider_zone_reconciliation tests.test_route_acceptance tests.test_route_acceptance_cli -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
