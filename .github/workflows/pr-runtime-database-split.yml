name: PR runtime database split validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/runtime.py'
      - 'eqquest/__main__.py'
      - 'EverQuestie.py'
      - 'tests/test_runtime_database_split.py'
      - 'docs/RUNTIME_DATABASE_SPLIT.md'
      - '.github/workflows/pr-runtime-database-split.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Import runtime boundary
        run: python -c "import eqquest.runtime; import eqquest.app; import eqquest.mapview; print('runtime split imports OK')"
      - name: Run runtime split tests
        run: python -m unittest tests.test_runtime_database_split -v
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
