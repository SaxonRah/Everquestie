name: PR canonical zone map catalog validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/zone_catalog.py'
      - 'eqquest/knowledge_build.py'
      - 'tools/build_map_catalog.py'
      - 'tests/test_zone_catalog.py'
      - '.github/workflows/pr-zone-map-catalog.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run zone catalog tests
        run: python -m unittest tests.test_zone_catalog -v
      - name: Run map and knowledge build regressions
        run: python -m unittest tests.test_map_catalog tests.test_knowledge_build -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
