name: PR packaged map collection root

on:
  push:
    branches:
      - agent/packaged-map-collection-root

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run packaged map regressions
        run: python -m unittest tests.test_packaged_map_collection_root tests.test_local_map_variant tests.test_local_map_readiness tests.test_local_map_readiness_ui tests.test_runtime_map_policy -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
