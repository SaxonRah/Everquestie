name: PR selectable nearby validation

on:
  push:
    branches:
      - agent/selectable-nearby

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run selectable nearby regressions
        run: python -m unittest tests.test_travel_nearby_selection tests.test_nearby tests.test_runtime_map_policy -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
