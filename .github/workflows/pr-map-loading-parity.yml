name: PR map loading parity

on:
  push:
    branches:
      - agent/unify-source-packaged-map-readiness

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run map loading regressions
        run: python -m unittest tests.test_runtime_zone_map_ui tests.test_runtime_zone_map_disambiguation tests.test_local_map_readiness_ui tests.test_runtime_map_policy -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
