name: PR Knowledge location chooser

on:
  push:
    branches:
      - agent/knowledge-location-chooser

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run Knowledge chooser regressions
        run: python -m unittest tests.test_knowledge_location_choices tests.test_knowledge_map_target tests.test_packaged_ui_policy tests.test_world_entity_context tests.test_world_entity_knowledge_detail tests.test_canonical_provider_where tests.test_locations tests.test_runtime_map_policy tests.test_local_map_readiness_ui tests.test_local_map_variant_runtime_ui tests.test_knowledge_snapshot -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
