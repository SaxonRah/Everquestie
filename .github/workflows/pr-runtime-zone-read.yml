name: PR packaged zone catalog runtime validation

on:
  push:
    branches:
      - agent/portable-manual-map-catalog
    paths:
      - 'eqquest/zone_catalog.py'
      - 'tests/test_runtime_database_split.py'
      - '.github/workflows/pr-runtime-zone-read.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portable-manual-map-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Run runtime split tests
        run: python -m unittest tests.test_runtime_database_split -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
