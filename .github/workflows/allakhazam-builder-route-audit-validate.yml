name: Allakhazam builder route audit validation

on:
  push:
    branches:
      - agent/allakhazam-builder-route-audit

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Focused builder and route audit regressions
        run: python -m unittest tests.test_knowledge_build tests.test_build_knowledge_cli tests.test_allakhazam_zone_travel_direction tests.test_provider_zone_travel tests.test_provider_zone_travel_runtime tests.test_route_acceptance tests.test_route_acceptance_cli -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
