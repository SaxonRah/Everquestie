name: Runtime import smoke

on:
  push:
    branches: [main]
    paths:
      - 'eqquest/**'
      - 'tests/**'
      - 'tools/**'
      - 'EverQuestie.py'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    paths:
      - 'eqquest/**'
      - 'tests/**'
      - 'tools/**'
      - 'EverQuestie.py'
      - '.github/workflows/runtime-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q eqquest tools tests EverQuestie.py
      - name: Import application
        run: python -c "import eqquest.app; import eqquest.mapview; import eqquest.mapraster; print('runtime imports OK')"
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
