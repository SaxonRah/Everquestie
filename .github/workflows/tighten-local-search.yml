name: Tighten local search implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tighten-local-search.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tighten ranking hot path
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('eqquest/local_search.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from typing import Iterable\n', '')

          old = '    aliases = [str(a["normalized_alias"]) for a in db.aliases_for_entity(int(row["id"]))]\n'
          new = (
              '    aliases = (\n'
              '        [str(a["normalized_alias"]) for a in db.aliases_for_entity(int(row["id"]))]\n'
              '        if norm else []\n'
              '    )\n'
          )
          if old not in s:
              raise SystemExit('alias ranking anchor missing')
          s = s.replace(old, new, 1)

          old = '    sql += " ORDER BY e.kind, e.name LIMIT ?"\n    args.append(candidate_limit)\n'
          new = (
              '    if use_fts:\n'
              '        sql += " ORDER BY fts_rank, e.kind, e.name LIMIT ?"\n'
              '    else:\n'
              '        sql += " ORDER BY e.kind, e.name LIMIT ?"\n'
              '    args.append(candidate_limit)\n'
          )
          if old not in s:
              raise SystemExit('candidate ordering anchor missing')
          s = s.replace(old, new, 1)

          pattern = re.compile(
              r'        if use_fts:\n'
              r'            return search_local_hits\(.*?'
              r'_search_like_fallback\(db, query, default_kind, current_zone, limit, offset\)\n'
              r'        raise',
              re.S,
          )
          replacement = (
              '        if use_fts:\n'
              '            return _search_like_fallback(db, query, default_kind, current_zone, limit, offset)\n'
              '        raise'
          )
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'fallback cleanup count={count}')

          p.write_text(s, encoding='utf-8')

      - name: Test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v

      - name: Commit
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/local_search.py
          git rm .github/workflows/tighten-local-search.yml
          git commit -m "Tighten local search ranking performance"
          git push
