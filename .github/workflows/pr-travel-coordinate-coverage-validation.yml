name: PR travel coordinate coverage validation

on:
  push:
    branches:
      - agent/travel-coordinate-coverage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run coverage regressions
        run: python -m unittest tests.test_zone_coverage tests.test_route_guidance -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
