name: PR canonical zone identity validation

on:
  push:
    branches:
      - agent/canonical-zone-identity

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests EverQuestie.py
      - name: Run zone identity regression
        run: python -m unittest tests.test_zone_identity -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
