name: Apply map label fallback integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-map-label-fallback.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch map lookup fallback
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent
          p = Path('eqquest/mapview.py')
          s = p.read_text(encoding='utf-8')

          old = 'from .local_search import map_label_terms, resolve_local_hits\n'
          new = (
              'from .local_search import map_label_terms, parse_local_query, resolve_local_hits, search_local_hits\n'
              'from .map_search import MapLabelHit, find_map_label_hits\n'
          )
          if old in s:
              s = s.replace(old, new, 1)
          elif 'from .map_search import MapLabelHit, find_map_label_hits\n' not in s:
              raise SystemExit('mapview local_search import anchor missing')

          old = '    game_to_map,\n    load_zone_map,\n'
          new = '    game_to_map,\n    map_to_game,\n    load_zone_map,\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif '    map_to_game,\n' not in s:
              raise SystemExit('map_to_game import anchor missing')

          start = s.index('    def _lookup_candidates(self, term: str, preferred_entity_id: int | None = None):')
          end = s.index('    def _lookup_name(self, term: str, preferred_entity_id: int | None = None) -> None:', start)
          block = indent(dedent('''\
          def _lookup_candidates(self, term: str, preferred_entity_id: int | None = None):
              query = parse_local_query(term)
              structured = bool(query.kinds or query.zone or query.source or query.exact)
              if structured:
                  return search_local_hits(
                      self.db,
                      term,
                      current_zone=self.get_zone(),
                      limit=40,
                  )
              return resolve_local_hits(
                  self.db,
                  term,
                  current_zone=self.get_zone(),
                  preferred_entity_id=preferred_entity_id,
                  limit=40,
              )

          def map_label_matches(self, term: str, *, limit: int = 40) -> list[MapLabelHit]:
              return find_map_label_hits(
                  self.zone_map,
                  term,
                  current_zone=self.get_zone() or self.manual_zone.get().strip() or None,
                  enabled_layers=self._enabled_layers(),
                  limit=limit,
              )

          def _map_label_detail_text(self, hit: MapLabelHit) -> str:
              gx, gy, gz = map_to_game(hit.x, hit.y, hit.z)
              zone = self.get_zone() or self.manual_zone.get().strip() or (self.zone_map.stem if self.zone_map else "unknown")
              layer_path = None
              if self.zone_map is not None and hit.layer in self.zone_map.layers:
                  layer_path = self.zone_map.layers[hit.layer].path.name
              lines = [
                  f"[map label] {hit.text}",
                  f"Zone: {zone}",
                  f"Layer: {hit.layer}",
                  f"EQ /loc: Y {gy:.1f}, X {gx:.1f}, Z {gz:.1f}",
              ]
              if layer_path:
                  lines.append(f"Map file: {layer_path}")
              if hit.source_line:
                  lines.append(f"Map source line: {hit.source_line}")
              lines += [
                  "",
                  "Local map evidence only — no normalized EverQuestie knowledge entity matches this label yet.",
                  "The map file does not encode whether this name is an NPC, quest, merchant, item, or another POI, so EverQuestie will not invent a type.",
                  "When a matching local entity is later available, this same label lookup will expose its quests, items, spells, merchant relationships, and other graph links automatically.",
              ]
              return "\\n".join(lines)

          def map_label_search_summary(self, term: str, *, limit: int = 20) -> list[str]:
              lines: list[str] = []
              for hit in self.map_label_matches(term, limit=limit):
                  gx, gy, gz = map_to_game(hit.x, hit.y, hit.z)
                  lines.append(
                      f"[map label] {hit.text} | layer {hit.layer} | /loc Y {gy:.1f}, X {gx:.1f}, Z {gz:.1f} | {hit.reason}"
                  )
              return lines

          '''), '    ')
          s = s[:start] + block + s[end:]

          lookup_start = s.index('    def _lookup_name(self, term: str, preferred_entity_id: int | None = None) -> None:')
          nohit_start = s.index('        if not hits:', lookup_start)
          nohit_end = s.index('        for hit in hits:', nohit_start)
          nohit = indent(dedent('''\
          if not hits:
              map_hits = self.map_label_matches(term, limit=20)
              if map_hits:
                  for index, hit in enumerate(map_hits):
                      self.lookup_tree.insert(
                          "", "end", iid=f"maplabel:{index}", text=hit.text,
                          values=("map label", hit.reason),
                      )
                  self.lookup_status.set(
                      f"No normalized DB entity; {len(map_hits)} current-map label candidate" +
                      ("s" if len(map_hits) != 1 else "")
                  )
                  self._set_lookup_detail(self._map_label_detail_text(map_hits[0]))
                  return
              self.lookup_status.set("No local DB or current-map label match")
              self._set_lookup_detail(f"No local EverQuestie knowledge or current-map label matches: {term}")
              return
          '''), '        ')
          s = s[:nohit_start] + nohit + s[nohit_end:]
          p.write_text(s, encoding='utf-8')

      - name: Patch Search and Knowledge fallback text
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent, indent
          p = Path('eqquest/app.py')
          s = p.read_text(encoding='utf-8')

          method = s.index('    def _search_local_from_search_tab(self) -> None:')
          start = s.index('        if not hits:', method)
          end = s.index('        lines = [f"LOCAL DB |', start)
          replacement = indent(dedent('''\
          if not hits:
              map_lines = self.map_view.map_label_search_summary(query) if hasattr(self, "map_view") else []
              if map_lines:
                  self._set_online_result(
                      f"LOCAL DB | no normalized entity match: {query}\\n\\n"
                      "CURRENT LOCAL MAP | unclassified label evidence\\n" +
                      "\\n".join(map_lines)
                  )
                  self.online_status_var.set(
                      "No normalized DB entity matched; current local map label evidence is shown. No network request was made."
                  )
                  return
              self._set_online_result(f"LOCAL DB / CURRENT MAP | no match: {query}")
              self.online_status_var.set("Local-only search complete. No network request was made.")
              return
          '''), '        ')
          s = s[:start] + replacement + s[end:]

          method = s.index('    def _search_knowledge(self):')
          start = s.index('        if not counts:', method)
          end = s.index('        known_order = ', start)
          replacement = indent(dedent('''\
          if not counts:
              map_lines = self.map_view.map_label_search_summary(term) if term and hasattr(self, "map_view") else []
              if map_lines:
                  self.entity_tree.insert(
                      "", "end", iid="info:maplabels",
                      text=f"Map labels ({len(map_lines)}) — no normalized DB entity yet",
                  )
                  self.entity_text.configure(state="normal")
                  self.entity_text.delete("1.0", "end")
                  self.entity_text.insert(
                      "end",
                      "No normalized EverQuestie knowledge entity matched. Current local map evidence:\\n\\n" +
                      "\\n".join(map_lines) +
                      "\\n\\nMap labels remain unclassified until another local source supplies an entity identity/type."
                  )
                  self.entity_text.configure(state="disabled")
                  return
              self.entity_tree.insert("", "end", iid="info:none", text="No local knowledge or current-map label matches.")
              self.entity_text.configure(state="normal")
              self.entity_text.delete("1.0", "end")
              self.entity_text.configure(state="disabled")
              return

          '''), '        ')
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Compile and test
        run: |
          python -m compileall -q eqquest EverQuestie.py
          python -m unittest discover -s tests -v

      - name: Commit integration
        run: |
          git config user.name "EverQuestie Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add eqquest/mapview.py eqquest/app.py eqquest/map_search.py tests/test_map_search.py
          git rm .github/workflows/apply-map-label-fallback.yml
          git commit -m "Keep map labels useful without DB entity matches"
          git push
