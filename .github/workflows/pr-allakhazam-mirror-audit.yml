name: PR Allakhazam mirror inventory audit

on:
  push:
    branches:
      - agent/allakhazam-mirror-audit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Run mirror inventory regressions
        run: python -m unittest tests.test_allakhazam_mirror_audit -v
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
