name: Real route acceptance validation

on:
  push:
    branches:
      - agent/real-route-acceptance-cases

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q eqquest tests tools EverQuestie.py
      - name: Focused route acceptance regressions
        run: python -m unittest tests.test_route_acceptance tests.test_route_acceptance_cli -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
