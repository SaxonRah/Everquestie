name: PR release builder and location validation

on:
  push:
    branches:
      - agent/release-builder-location

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependency
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Create disposable builder database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -c "from eqquest.db import Database; db=Database(r'build\\ci-working.sqlite3'); db.close()"
      - name: Build complete Windows release
        shell: powershell
        run: .\tools\build_release.ps1 -Version ci-test -WorkingDb .\build\ci-working.sqlite3 -OutputRoot .\build\ci-release -Force
      - name: Verify packaged boundary
        shell: pwsh
        run: |
          $Package = Join-Path $PWD 'build\ci-release\ci-test\EverQuestie'
          $Exe = Join-Path $Package 'EverQuestie.exe'
          $Knowledge = Join-Path $Package 'everquestie-knowledge.sqlite3'
          $Manifest = Join-Path $Package 'release-manifest.json'
          $Zip = Join-Path $PWD 'build\ci-release\ci-test\EverQuestie-ci-test-windows.zip'
          if (-not (Test-Path $Exe -PathType Leaf)) { throw "missing $Exe" }
          if (-not (Test-Path $Knowledge -PathType Leaf)) { throw "missing $Knowledge" }
          if (-not (Test-Path $Manifest -PathType Leaf)) { throw "missing $Manifest" }
          if (-not (Test-Path $Zip -PathType Leaf)) { throw "missing $Zip" }
          if (Test-Path (Join-Path $Package 'eqquest.sqlite3')) { throw 'builder DB leaked into package' }
          if (Test-Path (Join-Path $Package 'everquestie-user.sqlite3')) { throw 'user-state DB leaked into package' }
          python -c "import json, sqlite3, pathlib; p=pathlib.Path(r'build\\ci-release\\ci-test\\EverQuestie\\everquestie-knowledge.sqlite3'); c=sqlite3.connect(p); meta=dict(c.execute('select key,value from app_meta')); assert meta['database_role']=='knowledge_snapshot'; assert meta['knowledge_snapshot_version']=='ci-test'; assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; c.close(); m=json.loads(pathlib.Path(r'build\\ci-release\\ci-test\\EverQuestie\\release-manifest.json').read_text(encoding='utf-8-sig')); assert m['user_state_included'] is False; assert m['builder_database_included'] is False; assert m['knowledge']['embedded'] is False"
